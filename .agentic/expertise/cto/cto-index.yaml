key_decisions:
  - "Python for platform (ecosystem > raw performance for strategy research)"
  - "Bun.js for API (thin, fast, file-system native)"
  - "React + shadcn/ui for monitoring webapp"
  - "File-based JSON storage initially, abstracted for DB migration"
  - "Binance as first exchange, adapter pattern for future extensibility"
  - "Universal Strategy Protocol as the most critical abstraction"
  - "Phase 2 scope refined: researcher-ready platform over paper trading — validate framework, make it easy for algo-researchers"
  - "Paper trading deferred to Phase 3 — researcher tooling is the priority"
  - "Documentation is a first-class deliverable — the platform is only useful if researchers can use it"

development_roadmap:
  phase_1: "Foundation — COMPLETE (SPEC-000 delivered 2026-05-04)"
  phase_2: "Researcher-Ready — IMPLEMENTED 2026-05-05 (15 commits, pending human verification)"
  phase_3: "Live Simulation — paper trading, async data feeds, strategy state persistence, real execution preparation"
  phase_4: "Monitoring & Control — Bun.js API, React webapp, interactive management"
  phase_5: "Optimization — parameter tuning, strategy ensembles, advanced analytics"

delegation_history:
  - task: "SPEC-000 Platform Bootstrap"
    assignee: platform-developer
    delegated: 2026-05-05
    completed: 2026-05-05
    outcome: SUCCESS
    details: "All 11 milestones committed in order. 99 tests, 93% coverage, ruff/mypy clean. 3 CLI commands working. ~4,900 lines across 28 files."
    lessons:
      - "platform-developer follows spec precisely — detailed specs with exact commit messages work well"
      - "Platform developer adds a final polish commit (5533d21) to ensure acceptance criteria — good initiative"
      - "Delegation via `bun .claude/skills/delegate/scripts/delegate.ts` works but runs in background — need to wait for completion notification"
      - "Two delegation calls were made (bw7diecr4 and bvv8qyf74) — the first one completed the full implementation, second was redundant"
  - task: "SPEC-001 Validation Review"
    assignee: platform-developer
    delegated: 2026-05-05
    completed: 2026-05-05
    outcome: SUCCESS
    details: "Thorough review found 4 critical + 5 medium issues. All fixed in spec revision. Final confirmation passed — platform-developer updated own expertise with implementation notes."
    lessons:
      - "Pre-implementation validation catches real bugs — engine loop, missing context param, off-by-one candle counts would have caused failed tests and rework"
      - "platform-developer reads actual codebase during validation, not just the spec — catches interface mismatches"
      - "Two-round validation (initial review + fix confirmation) is efficient — total validation took ~10 minutes but saves hours of rework"
      - "Provide concrete test vectors (reference values) in specs — reduces ambiguity for mathematical computations"
  - task: "SPEC-001 Implementation (Phase 2)"
    assignee: platform-developer
    delegated: 2026-05-05
    completed: 2026-05-05
    outcome: SUCCESS
    details: "15 commits total: 12 spec steps + 3 polish/fix commits (infinity handling, gitignore, unused imports). First delegation (b8lzhwahd) failed at step 12 — second delegation (btle28boz) completed remaining work. Pending human verification of tests/coverage."
    background_task_id: "b8lzhwahd (partial), btle28boz (completed)"
    lessons:
      - "Large delegations (12 steps) may timeout or fail partway — second delegation to finish works well"
      - "platform-developer self-identified infinity edge case and fixed it — good defensive coding"
      - "Progress tracking file (001-progress.md) was critical for resuming work across delegations"
