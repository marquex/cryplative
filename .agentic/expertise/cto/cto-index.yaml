    trigger: "Immediately — Phase 1"
    priority: "CRITICAL"
    notes: "Everything depends on this hire. Start ASAP."
  - agent: backend-developer
    trigger: "Phase 4 — Monitoring & Control"
    priority: "HIGH"
    notes: "Hire when platform is producing data and results to serve."
  - agent: frontend-developer
    trigger: "Phase 4 — Monitoring & Control"
    priority: "HIGH"
