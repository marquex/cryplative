research_team_readiness:
  assessed: 2026-05-18
  question_1_storage_and_comparison:
    verdict: "YES — platform stores and compares backtest results across strategies today"
    what_exists:
      - "Standardized StrategyResult JSON (strategy_id, symbol, interval, params, trades, metrics, equity_curve)"
      - "Auto-saved to data/strategy_results/{strategy_id}_{symbol}_{interval}_{timestamp}.json"
      - "cryplative compare CLI for side-by-side Rich table with color-coded best/worst"
      - "Programmatic Python API for parameter sweeps — typed StrategyResult objects"
      - "Pydantic validation — safe to load, parse, compare programmatically"
    gaps:
      - "No results database — flat JSON files, no query across all runs"
      - "No tagging/metadata convention for hypothesis, regime, experiment batch"
      - "No automatic best-result tracking per strategy/pair combo"
      - "Results are local-only (data/ gitignored)"
      - "No diff/change tracking when re-running on updated data"
    recommendation: "Consider adding cryplative results query/summary command in Phase 2.5 or as quick standalone spec"
  question_2_slowdowns:
    high_impact:
      - "Fee modeling NOT YET implemented (Phase 2.5 Step 2 pending) — biggest distortion in backtest results"
      - "Results aggregation is manual — no turnkey query/summary tool"
      - "Strategy has no visibility into portfolio state — fixed position sizing only (Phase 3)"
    medium_impact:
      - "ATR/ADX/Keltner not in official indicators library (Phase 2.5 Steps 4-6 pending) — workaround: local helpers"
      - "Multi-timeframe limitation — single TF per backtest (Phase 3)"
      - "No SL/TP auto-triggering in backtesting (Phase 3)"
      - "No walk-forward validation mode (could be Phase 2.5 or Phase 5)"
    low_impact:
      - "No batch backtest CLI (script loops or Python API work)"
      - "No fetch-many command (script loops work)"
      - "Lookback window CLI flag pending (Phase 2.5 Step 3 — trivial)"

key_decisions:
  - "Python for platform (ecosystem > raw performance for strategy research)"
  - "Bun.js for API (thin, fast, file-system native)"
  - "React + shadcn/ui for monitoring webapp"
  - "File-based JSON storage initially, abstracted for DB migration"
  - "Binance as first exchange, adapter pattern for future extensibility"
  - "Universal Strategy Protocol as the most critical abstraction"
  - "Phase 2 scope refined: researcher-ready platform over paper trading — validate framework, make it easy for algo-researchers"
  - "Paper trading deferred to Phase 3 — researcher tooling is the priority"
  - "Documentation is a first-class deliverable — the platform is only useful if researchers can use it"
  - "Platform docs moved to platform_docs/ at project root (2026-05-06) — accessible to all agents, not just platform-developer"
  - "Added platform_docs/architecture.md as cross-agent architecture overview"
  - "Phase 2.5 planned based on research team needs — fee modeling + lookback CLI + ATR/ADX/Keltner indicators (2026-05-06)"
  - "Research team can write custom indicators as local helpers in strategy files — no restriction, Python modules are not sandboxed"
  - "Post-processing fee adjustment is an adequate interim workaround for strategy comparison"
  - "List-pairs feature (MarketFetcher.list_pairs() + cryplative pairs CLI) added to Phase 2.5 scope — blocks first research hire (2026-05-07)"
  - "Data cache layer confirmed working transparently — no action needed"
  - "Root-level venv with editable install needed — platform is NOT importable from data/ without sys.path hack (2026-05-07)"
  - "Directory ownership boundary: platform/ = toolkit owned by engineering, data/ = research artifacts owned by research team (CEO directive 2026-05-07)"
  - "Root venv setup COMPLETE (2026-05-07) — uv-provided Python 3.12.13, editable install, all 22 modules importable. Homebrew Python broken (libexpat/system libexpat mismatch), uv is the working solution."
  - "Platform-developer CANNOT execute tasks outside platform/ — cross-domain infra tasks (root .venv, root .gitignore) must be executed directly, not delegated (2026-05-07)"
  - "Environment: macOS system Python 3.9.6 too old; Homebrew Python 3.12/3.13 broken (pyexpat _XML_SetAllocTrackerActivationThreshold); uv-managed Python 3.12.13 works perfectly"
  - "Strategy results catalog (SPEC-004 v2): SQLite index layer over JSON results. Research team review incorporated: data_split/train_result_id (C1), multi-pattern rebuild (C2), engine return path (C3), metric thresholds (I1), experiment_id (I2), fees_included (I3), results show CLI (I4). fee_rate deferred. Engine insert stays outside engine (SoC). (2026-05-18)"
  - "StrategyResult does NOT have top-level symbol/interval — these come from BacktestConfig. Any catalog insert method must receive them explicitly. (discovered during SPEC-004 validation)"
  - "JSON result filenames encode symbol and interval — rebuild() must parse filenames since JSON lacks these top-level fields. Two filename patterns exist: engine format (with T00:00:00Z timestamps) and old format (bare dates). Non-result files (e.g., H2-detailed-results.json) must be skipped. (discovered during SPEC-004 validation, confirmed by research review C2)"
  - "BacktestEngine._save_result() returns None — must be updated to return saved file path for catalog integration. Non-breaking change (nobody checks return value). Public save_result() wrapper added. (discovered during SPEC-004 research review C3)"
  - "Research methodology requires train/test split tracking — catalog data_split field (TRAIN/TEST/FULL/OUT_OF_SAMPLE) + train_result_id linking prevents train/test contamination in compare_hypotheses(). Default to TEST-only comparisons. (from research team review C1, 2026-05-18)"  - "Platform documentation updated (Step 3): new public-api.md defines import contract for research team; all 7 docs updated for root venv setup (2026-05-07)"
  - "Platform-developer CANNOT execute tasks outside platform/ — cross-domain infra tasks (root .venv, root .gitignore) must be executed directly, not delegated (2026-05-07)"

