# Head of Research Expertise Index
# Agent: head-of-research
# Domain: Quantitative trading research — data, strategies, backtesting, portfolio construction

hierarchy:
  manager: ceo
  subordinates:
    strategy-implementer:
      title: "Strategy Implementer"
      status: "ACTIVE — onboarded and assigned H2 on 2026-05-07"
      current_task: "H2 RSI Divergence with Trend Filter — implementing in data/strategies/"
  planned_hires:
    strategy-researcher:
      title: "Strategy Researcher"
      role: "Future — when research volume justifies dedicated researcher"
      reports_to: "head-of-research"
      status: "future consideration"
    portfolio-risk:
      title: "Portfolio & Risk Manager"
      role: "Responsible for portfolio construction and risk management"
      reports_to: "head-of-research"
      status: "future — after 3+ validated strategies"
  eliminated:
    data-acquisition:
      reason: "CEO decided data fetching is simple enough (one CLI command) to be done on-demand by whoever needs it"

research_context:
  company:
    name: "Cryplative"
    mission: "Grow capital aggressively but sustainably via crypto algorithmic trading"
    approach: "Scientific, data-driven, systematic research — iterate based on evidence"

  trading_constraints:
    exchange: "Binance"
    pairs: "USDC only (EU jurisdiction restriction)"
    position_type: "Spot only, long only, no leverage"
    intervals: ["1h", "4h", "1d", "1w"]
    philosophy: "Per-pair strategies — no one-size-fits-all. Every pair has unique characteristics."
    research_note: "Can use USDT pairs for research (more data), implement on USDC pairs (similar behavior)"

  platform:
    language: "Python"
    modules: ["MarketFetcher", "Strategies", "Backtesting", "Portfolio Mgmt", "Real Execution", "Paper Trading", "Routines"]
    docs_location: "platform_docs/"

research_methodology:
  scientific_method:
    - "Formulate hypothesis based on market observation or theory"
    - "Define clear test criteria and success metrics"
    - "Backtest on historical data with proper train/test splits"
    - "Validate on out-of-sample data"
    - "Forward test (paper trading) before live deployment"
    - "Monitor live performance and iterate"

  common_pitfalls:
    - "Overfitting: strategies that work on historical data but fail live"
    - "Data snooping bias: using future information in backtests"
    - "Look-ahead bias: signals that use data not yet available"
    - "Survivorship bias: ignoring delisted assets"
    - "Insufficient sample size: statistically insignificant results"

  quality_standards:
    backtesting:
      - "Use walk-forward validation"
      - "Include transaction costs and slippage"
      - "Test on multiple market regimes (bull, bear, sideways)"
      - "Report Sharpe ratio, max drawdown, win rate, profit factor"
    documentation:
      - "Document hypothesis, methodology, results, and conclusions"
      - "Store results in data/strategy_results/ for future reference"
      - "Report both successes and failures — negative results are valuable"

directory_ownership:
  directive: "CEO Directive 2026-05-07 — Directory Ownership Boundary"
  research_owns: "data/ — ALL strategy implementations, market data, indicators, backtest results, performance metrics"
  engineering_owns: "platform/ — toolkit/libraries only, no research artifacts"
  boundary_rule: "Research imports platform as library. All output stays in data/."
  strategy_implementer_workspace: "data/strategies/ — implementer works here, imports from platform/"
  import_workaround: "sys.path hack until root venv with pip install -e ./platform is ready (Phase 2.5)"
  cto_assessment: ".agentic/specs/managers/cto-platform-importability-assessment.md"

data_management:
  locations:
    market_data: "data/market_cache/"
    strategy_implementations: "data/strategies/"
    strategy_results: "data/strategy_results/"

  data_requirements:
    - "Historical OHLCV data for backtesting"
    - "Clean, consistent data without gaps or anomalies"
    - "Multiple timeframes for multi-timeframe analysis"
    - "Fundamental data when relevant"

current_priorities:
  phase: "H2 COMPLETED/REJECTED — Drafting H5 spec next"
  onboarding_report: ".agentic/specs/research/onboarding-report.md"
  research_readiness_assessment: ".agentic/specs/managers/research-readiness-assessment.md"
  team_structure_response: ".agentic/specs/managers/research-team-update-response.md"
  cto_answers_received: ".agentic/specs/managers/cto-platform-answers.md"
  cto_answers_round2: ".agentic/specs/managers/cto-platform-answers-2.md"
  research_flow_questions: ".agentic/specs/managers/research-flow-questions.md"
  strategy_specs:
    H2: ".agentic/specs/research/H2-rsi-divergence-trend-filter.md"  # TESTED+REJECTED 2026-05-07 — too few signals
    H2_evaluation: ".agentic/specs/research/H2-evaluation.md"
    H2_results: "data/strategy_results/H2-report.md"
    H5: "NOT YET WRITTEN — PRIORITY, draft next"
    H1: "NOT YET WRITTEN — requires ATR/ADX helpers"
    H4: "NOT YET WRITTEN — requires ATR/Keltner helpers"
  immediate_tasks:
    - "DONE: H2 evaluated — REJECTED (too few signals, 3/7 criteria met)"
    - "PRIORITY: Draft H5 spec (ADX + SMA filter) for immediate delegation"
    - "ALIGN: CEO decisions on target returns, drawdown tolerance, capital allocation (defaults set)"
  lessons_learned:
    H2:
      - "RSI divergence is too rare for systematic trading with trend filter — 4-constraint filter on scarce pattern"
      - "Divergence strategies need higher-freq data or larger asset universe to generate enough signals"
      - "Relaxing parameters (oversold_threshold 40->50) changes the hypothesis fundamentally"
      - "1d timeframe too few candles for divergence detection with SMA(200) filter"
      - "Negative result valuable — won't revisit divergence without significant changes"
      - "Implementer performed well — competent execution, proper edge case handling, good deliverables"

