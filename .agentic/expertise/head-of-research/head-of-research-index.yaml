  H1: "Volatility breakout with volume confirmation (BB squeeze + volume)"
  H2: "RSI divergence with trend filter (only in uptrends)"
  H3: "Multi-timeframe momentum alignment (1h + 4h + 1d)"
  H4: "Mean-reversion with dynamic Keltner Channels"
