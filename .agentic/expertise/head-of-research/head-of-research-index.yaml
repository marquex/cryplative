  phase_25_upcoming: "--fee-rate flag, --lookback-window flag, ATR/ADX/Keltner in official library"
  workarounds_active:
    fee_adjustment: "Post-processing: deduct 0.2% round-trip per trade"
    custom_indicators: "Local helper functions in strategy files"
    sl_tp: "Self-tracked position state with candle-close checks"
