  strategies_available: ["sma_crossover", "rsi", "macd", "bollinger_bands"]
  indicators_available: ["compute_sma", "compute_ema", "compute_rsi", "compute_macd", "compute_bollinger_bands"]
  custom_indicators_implementable: ["compute_atr", "compute_adx", "compute_keltner_channels", "volume_ratio"]
  data_status: "CRITICAL — only 1000 hourly candles of BTC/USDT. BUT data pipeline is fully capable, can fetch any pair/timeframe immediately"
