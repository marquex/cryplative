      TestCLIBacktest: "3 tests — invalid params JSON, successful run, params from file"
      TestCLINewStrategy: "4 tests — scaffolds strategy, errors if exists, placeholder replacement, imports after creation"
      TestCLICompare: "3 tests — compares results, color coding, missing file error"
