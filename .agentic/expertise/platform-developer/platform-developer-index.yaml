files:
  # --- Project root ---
  platform/pyproject.toml:
    purpose: Project metadata, dependencies, tool config
    python: ">=3.11"
    build_system: hatchling
    cli_entry_point: "cryplative = 'cryplative.cli:app'"
    key_configs:
      pytest: testpaths=tests, pythonpath=src
      ruff: line-length=100, target=py311, rules=E,F,I,N,UP,B,A,SIM
      mypy: strict=true, plugins=[pydantic.mypy], ignore ccxt.*
    dependencies_phase2:
      numpy: ">=1.24 — Explicit runtime dependency (Phase 2 addition). Used by indicators library."
  platform/.python-version: "3.11"

  # --- Source: cryplative package ---
  platform/src/cryplative/__init__.py:
    purpose: Package root, docstring only

  platform/src/cryplative/config.py:
    purpose: Application configuration and logging setup
    key_functions:
      get_project_root: "() -> Path — walks up to find CLAUDE.md, fallback to platform/"
      setup_logging: "(config) -> None — configures structlog (json or console output)"
    key_classes:
      CryplativeConfig: "pydantic-settings BaseSettings, env_prefix=CRYPLATIVE_"
        fields:
          exchange_id: 'str = "binance"'
          binance_api_key: 'str = ""'
          binance_api_secret: 'str = ""'
          data_dir: 'str = "data"'
          market_cache_dir: 'str = "data/market_cache"'
          strategy_results_dir: 'str = "data/strategy_results"'
          log_level: 'str = "INFO"'
          log_format: 'Literal["json","console"] = "console"'
        methods:
          resolve_data_dir: "() -> Path"
          resolve_market_cache_dir: "() -> Path"
          resolve_strategy_results_dir: "() -> Path"
    notes: |
      Path resolution uses get_project_root() to find CLAUDE.md at repo root.
      This means data/ paths resolve relative to the cryplative/ project root,
      not relative to platform/. The .env file is loaded from CWD.

  platform/src/cryplative/cli.py:
    purpose: CLI entry point using Typer
    key_classes:
      app: "typer.Typer(name='cryplative', no_args_is_help=True)"
    commands:
      strategies: "List all registered strategies. --verbose shows default parameters."
      fetch: |
        Fetch and cache market data. Options: --symbol, --interval, --start, --end.
        Parses ISO 8601 dates. Displays Rich table summary.
      backtest: |
        Run a backtest. Options: --strategy, --symbol, --interval, --start, --end,
        --capital (default 10000), --params (JSON string or file path), --max-positions.
        Displays metrics table + trades table. Saves result JSON.
      new-strategy: |
        Scaffold a new strategy file from template. Args: strategy_name.
        Creates src/cryplative/strategies/{name}.py with placeholder replaced.
      compare: |
        Compare two backtest results side-by-side. Positional args: result_a.json result_b.json.
        Loads StrategyResult from JSON, prints Rich comparison table with color coding.
    notes: |
      Each command creates its own CryplativeConfig() and calls setup_logging().
      Strategy imports happen inside commands (lazy) to trigger registry.
      Uses Rich Console for all output formatting.
      Phase 2: Added new-strategy and compare commands. Enhanced --params to accept file paths.

  # --- Core module ---
  platform/src/cryplative/core/__init__.py:
    purpose: "Re-exports from interfaces + utilities"
    exports: [Candle, DataProvider, ExecutionHandler, Signal, SignalDirection, Strategy]

  platform/src/cryplative/core/exceptions.py:
    purpose: Custom exception hierarchy
    classes:
      CryplativeError: "Base exception (extends Exception)"
      MarketDataError: "Error fetching market data"
      StrategyError: "Error in strategy execution"
      BacktestError: "Error during backtesting"
      ConfigurationError: "Invalid configuration"

  platform/src/cryplative/core/interfaces.py:
    purpose: Abstract base classes defining contracts
    classes:
      Strategy: "ABC — every trading strategy must implement"
        abstract_properties: [strategy_id, strategy_name]
        abstract_methods: [generate_signal]
        default_methods:
          initialize: "(config) — stores self._config"
          teardown: "() — no-op"
          default_parameters: "() — returns dict[str, Any] (Phase 2 addition)"
          _min_candles_needed: "() — returns int (Phase 2 addition)"
      DataProvider: "ABC — abstraction for fetching market data"
        abstract_methods: [get_candles]
      ExecutionHandler: "ABC — abstraction for trade execution"
        abstract_methods: [submit_signal, close_trade]
    notes: |
      ExecutionHandler is defined but NOT YET IMPLEMENTED by any class.
      This is the interface for paper/real execution in future phases.
      Phase 2: Added default_parameters() and _min_candles_needed() to Strategy ABC.

  platform/src/cryplative/core/models.py:
    purpose: Pydantic v2 data models — single source of truth for all data shapes
    classes:
      Candle:
        fields: [symbol, interval, open_time, open, high, low, close, volume, close_time, closed]
        validators:
          non_negative_price_volume: "open, high, low, close, volume must be >= 0"
          open_before_close: "open_time < close_time (model_validator)"
      SignalDirection: "StrEnum — BUY, SELL"
      OrderType: "StrEnum — MARKET, LIMIT"
      Signal:
        fields: [strategy_id, symbol, timestamp, direction, order_type, price, quantity,
                 stop_loss, take_profit, confidence, metadata]
        validators:
          confidence_range: "0.0 <= confidence <= 1.0"
          non_negative_quantity: "quantity >= 0"
          limit_order_requires_price: "LIMIT orders must have price (model_validator)"
      TradeStatus: "StrEnum — OPEN, CLOSED, CANCELLED"
      RunContext: "StrEnum — BACKTEST, PAPER, REAL"
      Trade:
        fields: [trade_id, signal, entry_price, exit_price, quantity, pnl,
                 pnl_percentage, status, opened_at, closed_at, context]
        validators:
          non_negative_trade_fields: "entry_price, quantity >= 0"
      StrategyConfig:
        fields: [strategy_id, strategy_name, version, symbol, interval, parameters, state]
      StrategyMetrics:
        fields: [total_return, sharpe_ratio, max_drawdown, win_rate, total_trades, profit_factor]
      StrategyResult:
        fields: [strategy_id, run_type, start_date, end_date, parameters, trades, metrics, created_at]
    notes: |
      All enums use StrEnum (Python 3.11+). Signal uses dict[str, Any] for metadata
      with a default of {}. No frozen models. All support JSON serialization via
      model_dump_json() / model_validate_json().

  # --- Market Fetcher module ---
  platform/src/cryplative/market_fetcher/__init__.py:
    purpose: Docstring only

  platform/src/cryplative/market_fetcher/cache.py:
    purpose: Local JSON-based candle cache
    key_functions:
      _cache_path: "(cache_dir, symbol, interval) -> Path — e.g., BTC_USDT_1h.json"
      _candles_to_dicts: "(list[Candle]) -> list[dict]"
      _dicts_to_candles: "(list[dict]) -> list[Candle]"
      load_cache: "(cache_dir, symbol, interval) -> list[Candle] — empty list if missing"
      save_cache: "(cache_dir, symbol, interval, candles) -> None — full overwrite"
      update_cache: |
        (cache_dir, symbol, interval, new_candles) -> list[Candle]
        Merges by open_time key, deduplicates, sorts ascending, saves to disk.
    notes: |
      Cache files are one-per-symbol-interval. Format: JSON array of Candle dicts.
      Symbol format in filenames: "/" replaced with "_" (BTC/USDT -> BTC_USDT).

  platform/src/cryplative/market_fetcher/fetcher.py:
    purpose: Fetches candle data from exchanges via ccxt with caching
    key_functions:
      _ohlcv_to_candle: "(symbol, interval, ohlcv) -> Candle — converts ccxt [ts,o,h,l,c,v]"
      _interval_to_ms: "(interval) -> int — '1h' -> 3600000, '4h' -> 14400000, etc."
    key_classes:
      MarketFetcher: "implements DataProvider"
        constructor: "(config: CryplativeConfig | None = None)"
        private_fields: [_config, _exchange, _cache_dir]
        methods:
          _create_exchange: "() -> ccxt.Exchange — uses config.exchange_id, enables rate limiting"
          get_candles: |
            (symbol, interval, start_time?, end_time?, limit?) -> list[Candle]
            Logic: check cache -> determine what to fetch -> paginate ccxt.fetch_ohlcv()
            -> merge with cache -> filter by time range -> return sorted ascending.
    notes: |
      Paginated fetching: loops with current_since = last_candle.open_time + 1.
      Stops when: fewer candles returned than limit, or end_time reached.
      Always respects end_time in fetch loop. Raises MarketDataError on ccxt failures.

  # --- Strategies module (Phase 2 expanded) ---
  platform/src/cryplative/strategies/__init__.py:
    purpose: "Auto-discovers and imports all strategy modules via pkgutil"
    mechanism: |
      Uses pkgutil.iter_modules(__path__) to find all non-underscore modules.
      Replaces explicit `from cryplative.strategies import sma_crossover`.
      _template.py is skipped due to underscore prefix.
    notes: "Importing this package auto-registers all strategies"

  platform/src/cryplative/strategies/base.py:
    purpose: "Convenience re-exports from core.interfaces and core.models"
    exports: [Candle, DataProvider, ExecutionHandler, Signal, SignalDirection, Strategy]

  platform/src/cryplative/strategies/registry.py:
    purpose: Strategy discovery and registration
    key_classes:
      StrategyRegistry:
        type: "Class with classmethods (singleton-like, mutable class state)"
        state: "_strategies: dict[str, type[Strategy]]"
        methods:
          register: "(cls) -> Decorator. Instantiates temp object to read strategy_id."
          get: "(strategy_id) -> type[Strategy]. Raises KeyError if not found."
          list_strategies: "() -> list[str]"
          clear: "() -> None. Useful for testing."
    notes: |
      Registration uses @StrategyRegistry.register decorator on strategy classes.
      The decorator accesses strategy_id by creating a temporary instance via __new__.
      NOT thread-safe due to mutable class-level dict.

  platform/src/cryplative/strategies/indicators.py:  # PHASE 2 NEW
    purpose: Common technical indicators library
    key_functions:
      sma: "(data: list[float] | np.ndarray, period: int) -> list[Optional[float]]"
        notes: "Simple Moving Average. None for indices < period-1. Uses numpy internally."
      ema: "(data: list[float] | np.ndarray, period: int) -> list[Optional[float]]"
        notes: "Exponential Moving Average. Seed with SMA(period), then EMA formula."
      rsi: "(data: list[float] | np.ndarray, period: int) -> list[Optional[float]]"
        notes: "Relative Strength Index. Wilder's smoothing. First valid at index period."
      macd: "(data: list[float] | np.ndarray, fast: int, slow: int, signal: int) -> tuple[list[Optional[float]], list[Optional[float]], list[Optional[float]]]"
        notes: "Returns (macd_line, signal_line, histogram). Histogram = MACD - Signal."
      bollinger_bands: "(data: list[float] | np.ndarray, period: int, std_dev: float) -> tuple[list[Optional[float]], list[Optional[float]], list[Optional[float]]]"
        notes: "Returns (upper, middle, lower). Middle = SMA, Upper/Lower = ± std_dev * std."
    notes: |
      All functions accept list[float] OR np.ndarray. Return list[float | None].
      None values during warmup period. All use numpy internally for performance.
      Reference values tested against spec-defined inputs.

  platform/src/cryplative/strategies/_template.py:  # PHASE 2 NEW
    purpose: Strategy template for scaffolding new strategies
    placeholder_strings: ["<STRATEGY_ID>", "<STRATEGY_NAME>", "<ClassName>", "<default_parameters_doc>"]
    notes: "Underscore prefix prevents auto-discovery. Used by 'cryplative new-strategy' CLI."

  platform/src/cryplative/strategies/sma_crossover.py:
    purpose: SMA Crossover strategy — "Hello World" of trading
    key_classes:
      SMACrossoverStrategy: "decorated with @StrategyRegistry.register"
        strategy_id: "sma_crossover"
        strategy_name: "SMA Crossover"
        defaults: "fast_period=10, slow_period=20"
        default_parameters: "Returns {fast_period: 10, slow_period: 20}"
        _min_candles_needed: "Returns slow_period + 1"
        initialize: "Reads fast_period and slow_period from config.parameters"
        generate_signal: |
          (candles: list[Candle]) -> Signal | None
          Requires slow_period + 1 candles.
          Compares last 2 values of fast SMA and slow SMA.
          BUY: prev_fast <= prev_slow and curr_fast > curr_slow
          SELL: prev_fast >= prev_slow and curr_fast < curr_slow
          Fixed confidence=0.5, quantity=1.0, no stop_loss/take_profit.
    notes: |
      Refactored in Phase 2 to use indicators.sma() instead of local compute_sma().
      Warns (log) if fast_period >= slow_period but doesn't prevent it.
      Metadata on signals includes fast_sma, slow_sma, fast_period, slow_period.

  platform/src/cryplative/strategies/rsi_strategy.py:  # PHASE 2 NEW
    purpose: RSI (Relative Strength Index) mean-reversion strategy
    key_classes:
      RSIStrategy: "decorated with @StrategyRegistry.register"
        strategy_id: "rsi_strategy"
        strategy_name: "RSI Strategy"
        defaults: "period=14, oversold=30, overbought=70"
        default_parameters: "Returns {period: 14, oversold: 30, overbought: 70}"
        _min_candles_needed: "Returns period + 2"
        generate_signal: |
          BUY when RSI crosses above oversold threshold (oversold → not oversold).
          SELL when RSI crosses below overbought threshold (overbought → not overbought).
    notes: |
      Uses indicators.rsi(). Requires period + 2 candles for crossover detection.
      Confidence = 0.6, quantity = 1.0. Metadata includes RSI value.

  platform/src/cryplative/strategies/macd_strategy.py:  # PHASE 2 NEW
    purpose: MACD (Moving Average Convergence Divergence) trend-following strategy
    key_classes:
      MACDStrategy: "decorated with @StrategyRegistry.register"
        strategy_id: "macd_strategy"
        strategy_name: "MACD Strategy"
        defaults: "fast_period=12, slow_period=26, signal_period=9"
        default_parameters: "Returns {fast_period: 12, slow_period: 26, signal_period: 9}"
        _min_candles_needed: "Returns slow_period + signal_period"
        generate_signal: |
          BUY when MACD line crosses above signal line (histogram goes - → +).
          SELL when MACD line crosses below signal line (histogram goes + → -).
    notes: |
      Uses indicators.macd(). Requires slow + signal candles for crossover.
      Confidence = 0.7, quantity = 1.0. Metadata includes MACD, signal, histogram.

  platform/src/cryplative/strategies/bollinger_bands_strategy.py:  # PHASE 2 NEW
    purpose: Bollinger Bands mean-reversion strategy
    key_classes:
      BollingerBandsStrategy: "decorated with @StrategyRegistry.register"
        strategy_id: "bollinger_bands_strategy"
        strategy_name: "Bollinger Bands Strategy"
        defaults: "period=20, std_dev=2.0"
        default_parameters: "Returns {period: 20, std_dev: 2.0}"
        _min_candles_needed: "Returns period + 1"
        generate_signal: |
          BUY when price crosses below lower band (oversold).
          SELL when price crosses above upper band (overbought).
    notes: |
      Uses indicators.bollinger_bands(). Requires period + 1 candles for crossover.
      Confidence = 0.6, quantity = 1.0. Metadata includes upper, middle, lower.

  # --- Backtesting module (Phase 2 refactored) ---
  platform/src/cryplative/backtesting/__init__.py:
    purpose: Docstring only

  platform/src/cryplative/backtesting/engine.py:
    purpose: Runs strategies against historical data with multi-position support
    key_classes:
      BacktestConfig:
        type: Plain Python class (NOT Pydantic model)
        fields: [strategy_id, symbol, interval, start_date, end_date, initial_capital,
                 parameters, lookback_window, max_positions]  # Phase 2 added max_positions
        defaults: "initial_capital=10000.0, lookback_window=200, max_positions=1"
        methods:
          start_timestamp_ms: "() -> int — parses ISO 8601 date string"
          end_timestamp_ms: "() -> int"
      BacktestEngine:
        constructor: "(data_provider: DataProvider, config: CryplativeConfig | None)"
        methods:
          run: "(backtest_config: BacktestConfig) -> StrategyResult"
            steps: |
              1. Resolve strategy from StrategyRegistry
              2. Validate candle count against strategy._min_candles_needed()
              3. Fetch candles via data_provider
              4. Initialize strategy with StrategyConfig
              5. Create PortfolioTracker with max_positions and context
              6. Simulate: iterate candles with sliding window
                 - BUY signal + can_open() → open_position(close_price)
                 - SELL signal + open positions → close_oldest(close_price)
                 - Always snapshot_equity()
              7. Force-close remaining open positions (while loop)
              8. Calculate metrics from all_trades
              9. Save result JSON to strategy_results_dir
              10. Call strategy.teardown()
          _calculate_metrics: "(closed_trades, equity_curve, initial_capital) -> StrategyMetrics"
            notes: |
              total_return: from equity curve final vs initial_capital
              max_drawdown: peak-to-trough from equity curve
              sharpe_ratio: from trade returns, annualized with sqrt(N), rf=0
              win_rate: wins/total * 100
              profit_factor: gross_profit/gross_loss (inf if no losses)
              Returns zeros for all metrics if no trades.
              Phase 2: Handles infinity values (Sharpe, profit_factor) for JSON serialization.
          _save_result: "(result, config) -> None"
            filename_pattern: "{strategy_id}_{symbol}_{interval}_{start}_{end}.json"
    notes: |
      Phase 2 refactored for multi-position support.
      Execution is at candle close price (simplified).
      Sliding window: candles[max(0, i-lookback_window+1) : i+1]
      Supports long-only (BUY opens, SELL closes). No shorting.
      max_positions parameter allows concurrent trades.
      FIFO position closing: close_oldest() on SELL signals.
      Infinity handling: metrics can be inf, gets converted to float for JSON.

  # --- Portfolio module (Phase 2 refactored) ---
  platform/src/cryplative/portfolio/__init__.py:
    purpose: Docstring only

  platform/src/cryplative/portfolio/tracker.py:
    purpose: Multi-position portfolio tracking during strategy runs
    key_classes:
      PortfolioTracker:
        constructor: "(initial_capital: float, context: RunContext = RunContext.BACKTEST, max_positions: int = 1)"
        state:
          capital: float
          open_trades: "list[Trade] — Phase 2: was single position/entry_price"
          closed_trades: "list[Trade] — Phase 2: separated from open_trades"
          _context: RunContext
          _equity_curve: "list[tuple[int, float]]"
          max_positions: int  # Phase 2 addition
        properties:
          has_open_position: bool — "len(open_trades) > 0"
          all_trades: "list[Trade] — open_trades + closed_trades"
          open_trade: "Trade | None — DEPRECATED: returns oldest open trade for backward compat"
        methods:
          open_position: "(signal, price, timestamp) -> Trade"
            notes: "Checks can_open() first. Raises if at limit. Deducts cost from capital."
          close_position: "(trade: Trade, price, timestamp) -> Trade"
            notes: "Phase 2: takes Trade arg (which trade to close). Adds proceeds to capital."
          close_oldest: "(price, timestamp) -> Trade | None"
            notes: "Phase 2: FIFO close for engine use. Closes earliest open trade."
          can_open: "() -> bool"
            notes: "Phase 2: len(open_trades) < max_positions"
          snapshot_equity: "(timestamp, price) -> None"
            notes: "Phase 2: renamed from record_equity(). Snapshots equity curve."
          get_equity: "(current_price) -> float"
            notes: "Phase 2: sum over all open_trades (cash + position_value)"
          get_equity_curve: "() -> list[tuple[int, float]]"
    notes: |
      Phase 2 complete refactor for multi-position support.
      Allows negative capital (no guard). Multiple concurrent positions.
      FIFO closing via close_oldest(). Backward compatible with max_positions=1.

