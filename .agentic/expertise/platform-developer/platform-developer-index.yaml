# =============================================================================
# 2. ARCHITECTURE (POST-PHASE 2)
# =============================================================================

architecture:
  layer_structure: |
    CLI Layer (cli.py) — Typer commands: strategies, fetch, backtest, new-strategy, compare.
    Backtesting Layer (backtesting/engine.py) — Orchestrates: data fetch -> strategy -> portfolio -> metrics
    Comparison Layer (backtesting/comparison.py) — Result comparison utilities
    Strategy Layer (strategies/) — StrategyRegistry (decorator pattern), Strategy interface, 5 strategies
    Data Layer (market_fetcher/) — MarketFetcher -> ccxt exchange -> local JSON cache
    Portfolio Layer (portfolio/tracker.py) — Multi-position management, equity curve
    Indicators Layer (strategies/indicators.py) — Common technical indicators library
    Core (core/) — Pydantic models (source of truth), ABCs, exceptions
    Config (config.py) — CryplativeConfig (pydantic-settings), setup_logging

  package_layout: |
    platform/src/cryplative/ — Main package (src layout)
      cli.py — Entry point
      config.py — Configuration
      core/ — Abstract layer (models, interfaces, exceptions)
      market_fetcher/ — Data acquisition
      strategies/ — Strategy interface + implementations + indicators + template
      backtesting/ — Backtest engine + comparison utilities
      portfolio/ — Multi-position portfolio tracking
    platform/tests/ — Test suite
    platform/docs/researcher/ — Researcher documentation (5 markdown files)
    data/ — File-based storage (at project root)
      market_cache/ — Cached candle data
      strategy_results/ — Backtest results

  dependency_directions: |
    cli.py -> config, backtesting.engine, market_fetcher.fetcher, backtesting.comparison, strategies
    backtesting.engine -> portfolio.tracker, strategies.registry, strategies.indicators, core.models
    backtesting.comparison -> core.models
    portfolio.tracker -> core.models
    strategies.* -> strategies.indicators, strategies.registry, core.interfaces, core.models
    strategies.indicators -> numpy (no internal deps)
    market_fetcher.fetcher -> market_fetcher.cache, config, core.interfaces, core.models
    market_fetcher.cache -> core.models
    core.interfaces -> core.models (imports Candle, Signal, StrategyConfig, Trade)
    core.models -> pydantic (no internal deps)

# =============================================================================
# 3. KEY PATTERNS (POST-PHASE 2)
# =============================================================================

patterns:
  strategy_pattern: |
    Strategy interface (ABC) defines contract: strategy_id, strategy_name, initialize(),
    generate_signal(), teardown(), default_parameters(), _min_candles_needed().
    All strategies implement this. The backtesting engine calls these methods polymorphically.
    New strategies: use 'cryplative new-strategy' command or copy _template.py.

  registry_pattern: |
    StrategyRegistry uses class-level mutable dict with @classmethod decorator.
    @StrategyRegistry.register on a class auto-registers it by strategy_id.
    strategies/__init__.py uses pkgutil.iter_modules() for auto-discovery.
    Has clear() for testing. Underscore modules (like _template.py) are skipped.

  adapter_pattern: |
    MarketFetcher implements DataProvider (ABC). In tests, MockDataProvider and
    SyntheticDataProvider also implement DataProvider. This allows swapping data
    sources without changing the backtesting engine.

  builder_pattern: |
    BacktestConfig is a plain class built from CLI args. StrategyConfig (Pydantic)
    is built inside BacktestEngine.run() from BacktestConfig fields.

  template_method: |
    Strategy.initialize() has a default impl (stores _config). Strategies override
    for custom setup (e.g., SMA reads parameters). Strategy.teardown() default is no-op.
    Phase 2: default_parameters() and _min_candles_needed() have defaults.

  indicator_pattern: |
    All indicators are pure functions: list[float] | np.ndarray -> list[Optional[float]].
    Use numpy internally for performance, return list externally for compatibility.
    Return None during warmup period. No side effects, no class state.

  sliding_window: |
    BacktestEngine iterates candles with a sliding window of lookback_window size.
    window = candles[max(0, i-lookback_window+1) : i+1]

  fifo_position_closing: |
    Multi-position backtesting uses FIFO (First-In-First-Out) for closing.
    SELL signals close the oldest open position via close_oldest().
    Maintains backward compatibility with max_positions=1.

  auto_discovery_pattern: |
    pkgutil.iter_modules(__path__) finds all modules in strategies/ package.
    Import side-effect triggers @StrategyRegistry.register decorator.
    Underscore prefix modules (_template.py) are skipped.
    Testing requires sys.modules cleanup to avoid pollution.

  file_based_storage: |
    JSON files in data/ directory. One cache file per symbol+interval.
    One result file per backtest run. No database, no ORM.

  scaffolding_pattern: |
    new-strategy command copies _template.py and replaces placeholders.
    Placeholders: <STRATEGY_ID>, <STRATEGY_NAME>, <ClassName>, <default_parameters_doc>.
    Uses string.replace() for simple text substitution.
    Errors if target file already exists.

# =============================================================================
# 4. DATA FLOW (POST-PHASE 2)
# =============================================================================

data_flow:
  fetch_command: |
    1. CLI parses args (--symbol, --interval, --start, --end)
    2. MarketFetcher.get_candles() called
    3. load_cache() checks for existing data in data/market_cache/
    4. If new data needed: ccxt exchange.fetch_ohlcv() paginated calls
    5. update_cache() merges new + existing, deduplicates by open_time, saves
    6. Filter by start_time/end_time range
    7. Return sorted list[Candle]
    8. CLI displays summary table via Rich

  backtest_command: |
    1. CLI parses args, builds BacktestConfig (including max_positions)
    2. BacktestEngine.run() starts:
       a. Validate candle count against strategy._min_candles_needed()
       b. StrategyRegistry.get(strategy_id) -> strategy class
       c. data_provider.get_candles() -> list[Candle]
       d. StrategyConfig built, strategy.initialize(config) called
       e. PortfolioTracker created with initial_capital, max_positions, context
    3. Main simulation loop (for each candle):
       a. Build sliding window of lookback_window candles
       b. strategy.generate_signal(window) -> Signal or None
       c. BUY + can_open() -> tracker.open_position(signal, candle.close, timestamp)
       d. SELL + open_trades -> tracker.close_oldest(candle.close, timestamp)
       e. tracker.snapshot_equity(timestamp, candle.close) [always]
    4. Force-close remaining open positions (while loop)
    5. _calculate_metrics() from equity_curve and all_trades (handles infinity)
    6. _save_result() writes JSON to data/strategy_results/
    7. strategy.teardown()
    8. Return StrategyResult (trades + metrics)

  compare_command: |
    1. CLI loads two StrategyResult from JSON files
    2. compare_results() compares metrics side-by-side
    3. Rich displays comparison table with color coding
    4. Green = better value, Red = worse value, Neutral for total_trades

  new_strategy_command: |
    1. CLI validates strategy_name (snake_case)
    2. Derives ClassName (PascalCase), STRATEGY_ID (snake), STRATEGY_NAME (Title Case)
    3. Reads _template.py
    4. Replaces placeholders with derived values
    5. Writes to src/cryplative/strategies/{name}.py
    6. Errors if file exists

  indicator_computation: |
    Input: list[float] or np.ndarray of prices
    Process: Convert to numpy array, compute indicator, convert back to list
    Output: list[Optional[float]] with None during warmup
    Example: sma([10, 20, 30, 40, 50], 3) -> [None, None, 20.0, 30.0, 40.0]

  auto_discovery_flow: |
    1. strategies/__init__.py imported
    2. pkgutil.iter_modules(strategies.__path__) finds all .py files
    3. For each module (except _underscore): import module
    4. Module import triggers @StrategyRegistry.register decorator
    5. Strategy class instantiated to read strategy_id
    6. strategy_id -> type[Strategy] stored in _strategies dict

  ohlcv_conversion: |
    ccxt returns: [[timestamp_ms, open, high, low, close, volume], ...]
    _ohlcv_to_candle() converts to Candle object.
    close_time = timestamp + interval_ms - 1.
    Interval conversion: 1h->3600000, 4h->14400000, 1d->86400000, 1w->604800000.

  cache_merge: |
    update_cache() builds dict keyed by open_time from existing + new.
    New candles overwrite existing for same open_time (latest data wins).
    Sorts by open_time ascending. Writes full file (no incremental).

