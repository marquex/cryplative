    total: "~3500 LOC (Phase 1: ~2000, Phase 2: +1500)"
    source: "~1800 LOC"
    tests: "~1400 LOC"
    docs: "~300 LOC"

  indicator_warmup_periods:
    notes: "Critical for setting _min_candles_needed() correctly in strategies."
    sma: "First valid at index period-1. Two values need period+1 data points."
    ema: "First valid at index period-1 (seeded with SMA). Two values need period+1 data points."
    rsi: |
      Wilder's smoothing: first avg_gain/avg_loss from period changes → needs period+1 prices.
      First RSI at index period. Two values for crossover need period+2 data points.
      RSI strategy minimum: period + 2 (= 16 with default period=14).
    macd: |
      MACD line first valid at index slow-1. Signal EMA needs signal MACD values.
      First signal line at index slow+signal-2. Two histogram values at index slow+signal-1.
      MACD strategy minimum: slow_period + signal_period (= 35 with defaults 26+9).
    bollinger_bands: |
      SMA(period) first valid at index period-1. Two band values for crossover need period+1.
      Bollinger Bands strategy minimum: period + 1 (= 21 with default period=20).

  multi_position_backward_compat:
    key_insight: |
      With max_positions=1 (default), the refactored engine produces identical results
      to Phase 1. Changes: method name renames on tracker object.
      Preserved: loop start index, window construction, timestamp field, iteration pattern.
      Equity curve semantics preserved (equity at close = position value + cash).

  portfolio_tracker_refactor:
    changes: |
      - Add max_positions param (default 1)
      - Replace single position/entry_price with open_trades: list[Trade]
      - Add closed_trades: list[Trade] (separate from open)
      - open_position: check can_open() before allowing, raise on limit
      - close_position: take Trade arg (which trade to close)
      - close_oldest: FIFO close for engine use
      - can_open: len(open_trades) < max_positions
      - all_trades: open_trades + closed_trades
      - Rename record_equity → snapshot_equity
      - get_equity: sum over all open_trades
      - Keep context: RunContext parameter for Trade model

  engine_refactor:
    changes: |
      - Add max_positions to BacktestConfig.__init__ (default 1)
      - Pass max_positions + context to PortfolioTracker constructor
      - Replace has_open_position → can_open() for BUY checks
      - Replace has_open_position → len(tracker.open_trades) > 0 for SELL checks
      - Replace close_position → close_oldest (FIFO)
      - Replace record_equity → snapshot_equity
      - Replace portfolio.trades → tracker.all_trades
      - Replace single force-close with while loop
      - Add _min_candles_needed() validation
      - Add infinity handling in metrics

  auto_discovery:
    mechanism: |
      strategies/__init__.py uses pkgutil.iter_modules(__path__) to import all
      non-underscore modules. Replaces explicit import statement.
      _template.py starts with underscore so it's automatically skipped.
      Testing uses tmp_path and sys.modules cleanup to avoid polluting real package.

  new_cli_commands:
    new_strategy: |
      Scaffolds a new strategy from _template.py template.
      Replaces <PLACEHOLDER> strings with derived values.
      Writes to src/cryplative/strategies/{name}.py. Errors if file exists.
    compare: |
      Positional args: cryplative compare result_a.json result_b.json.
      Loads StrategyResult from JSON, prints Rich comparison table.
      Color coding: green=best, red=worst per metric row.
    strategies_verbose: |
      --verbose flag shows default_parameters() per strategy.

  backtest_cli_enhancements:
    - "--params accepts JSON file path (if ends with .json) or JSON string"
    - "--max-positions flag passed through to BacktestConfig"
    - Better error messages: list available strategies, suggest date ranges, show parse errors"

  issues_hit:
    - "Infinity values in comparison data: Sharpe ratio and profit_factor can be inf.
       Fixed by converting to float in JSON serialization (inf → 'Infinity' string → float)."
    - "First delegation timed out at step 12: Took too long to complete all 12 steps.
       Fixed by splitting into two delegations: 12 spec steps + 3 polish fixes."
    - "Auto-discovery test pollution: Strategies registered in test polluted real package.
       Fixed with sys.modules cleanup and StrategyRegistry.clear() in test teardown."

