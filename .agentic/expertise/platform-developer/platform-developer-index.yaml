# =============================================================================
# 11. GOTCHAS & INTERNAL KNOWLEDGE (POST-PHASE 2)
# =============================================================================

gotchas:
  - |
    Path resolution: get_project_root() walks UP from the source file to find CLAUDE.md.
    This means data paths resolve to the cryplative/ project root (where CLAUDE.md lives),
    NOT relative to platform/. Tests override paths via CryplativeConfig constructor.
  - |
    StrategyRegistry.clear() must be called in test setup_method to prevent
    cross-test pollution since the registry uses mutable class-level state.
    Phase 2 auto-discovery: also need sys.modules cleanup to avoid importing
    test strategies into the real package.
  - |
    _ohlcv_to_candle computes close_time as open_time + interval_ms - 1.
    The interval_ms lookup only supports m, h, d, w suffixes. Defaults to 3600000 (1h).
  - |
    In MarketFetcher.get_candles(), the pagination loop increments current_since
    by new_candles[-1].open_time + 1 to avoid duplicates from ccxt.
  - |
    Indicators use numpy internally but return list[Optional[float]].
    None values during warmup period (indices < period-1 for SMA/EMA).
    Test warmup carefully — strategies need enough candles to avoid None.
  - |
    PortfolioTracker.open_position allows capital to go negative. It logs a warning
    but does NOT prevent the trade. This is intentional for Phase 1 simplicity.
  - |
    BacktestConfig is a plain Python class with __init__, NOT a Pydantic model.
    This means no automatic validation. The CLI passes user input directly.
  - |
    Equity is recorded every candle regardless of whether a trade happens.
    The equity curve grows linearly with number of candles.
  - |
    The force-close at end of backtest closes at the LAST candle's close price,
    not at a separate exit point. This can affect metrics if the last signal
    was a BUY just before data ends.
  - |
    In the Sharpe ratio calculation, annualization uses sqrt(N) where N is
    the number of trades. This is a common but debatable annualization approach.
  - |
    Infinity handling: Sharpe ratio and profit_factor can be inf (no losses or all wins).
    JSON serialization converts inf to float, which may lose precision but prevents errors.
  - |
    Auto-discovery uses pkgutil.iter_modules() which finds .py files at runtime.
    Testing with tmp_path requires sys.modules cleanup to avoid polluting the real package.
    StrategyRegistry.clear() alone is NOT enough for auto-discovery tests.
  - |
    new-strategy command uses simple string.replace() for placeholder substitution.
    If strategy_name contains unexpected characters, may create invalid Python.
    No validation beyond basic file existence check.
  - |
    compare command color coding: Green for better value, Red for worse.
    Assumes "lower is better" for max_drawdown, "higher is better" for others.
    total_trades is neutral (more isn't always better).
  - |
    Multi-position backward compatibility: With max_positions=1, the refactored
    engine MUST produce identical results to Phase 1. Key invariants:
    - Loop starts at same index
    - Window construction formula unchanged
    - Timestamp field (open_time) unchanged
    - Equity recorded at same points (always snapshot_equity)
    - FIFO close_oldest() behaves same as single close_position() when max_positions=1
  - |
    _min_candles_needed() must account for indicator warmup + crossover detection.
    Example: RSI needs period + 2 (period for warmup, +2 for crossover).
    Forgetting the "+2 for crossover" causes premature BUY/SELL signals.

