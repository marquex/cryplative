# Agent: platform-developer
# Domain: Python trading platform — market data, strategies, backtesting, live execution
# Last updated: 2026-05-18 (SPEC-004 implementation complete)

hierarchy:
  manager: cto
  subordinates: [none — leaf agent]

status: |
  Phase 1 (SPEC-000): Core backtesting platform with SMA Crossover strategy
  Phase 2 (SPEC-001): Multi-position support, indicators library, 3 new strategies, auto-discovery, scaffolding
  Phase 3 (SPEC-004): Strategy results catalog with SQLite index, CLI commands, backtest integration
  Test coverage: 92% (292 tests, 71 catalog + 15 catalog CLI)

# =============================================================================
# KEY LEARNINGS
# =============================================================================

learnings:
  phase2_indicator_warmup:
    insight: |
      Indicator warmup periods are critical for _min_candles_needed(). Getting this wrong
      causes strategies to generate signals on insufficient data (None values).
    details:
      - SMA/EMA: First valid at period-1, need period+1 for crossover detection
      - RSI: Wilder's smoothing needs period+1 for first value, +2 for crossover
      - MACD: Slow period + signal period for first histogram value
      - Bollinger Bands: Period + 1 for crossover detection
    impact: |
      Strategies now correctly implement _min_candles_needed() to prevent premature signals.
      Test fixtures generate enough data to avoid warmup issues.

  phase2_multi_position_refactor:
    insight: |
      Refactored from single-position to multi-position while maintaining 100% backward compatibility.
      The key: default max_positions=1 produces identical results to Phase 1.
    changes:
      - PortfolioTracker: open_trades list, FIFO closing, can_open() guard
      - BacktestEngine: while loop for force-close, max_positions parameter
      - All single-position tests still pass with max_positions=1
    gotcha: |
      close_oldest() must be used by engine, not close_position(). This ensures FIFO semantics
      and maintains backward compatibility with max_positions=1.

  phase2_infinity_handling:
    problem: |
      Sharpe ratio and profit_factor can be infinity (no losses or all wins).
      Pydantic's JSON serializer raises TypeError on inf values.
    solution: |
      Convert inf to float before serialization. model_dump_json() handles this,
      but comparison data formatting needed explicit float() conversion.
    tradeoff: |
      Loses precision (inf → 'Infinity' string → float('inf')), but prevents crashes.

  phase2_auto_discovery:
    insight: |
      pkgutil.iter_modules() finds .py files at runtime. Import side-effect triggers
      @StrategyRegistry.register decorator. Underscore prefix modules skipped.
    gotcha: |
      Testing requires sys.modules cleanup. StrategyRegistry.clear() alone isn't enough
      because test strategies get imported into the real package. Cleanup pattern:
      1. Delete test modules from sys.modules
      2. Call StrategyRegistry.clear()

  numpy_vs_lists:
    decision: |
      Indicators use numpy internally but return list[Optional[float]].
    reasoning:
      - Numpy for performance on computation
      - Lists for API compatibility (strategies expect lists)
      - None values during warmup (numpy doesn't handle None well)
    pattern: |
      Input: Convert to numpy array → Compute indicator → Convert to list with None padding

# =============================================================================
# ARCHITECTURE
# =============================================================================

architecture:
  layers: |
    CLI (Typer) → Backtesting → Strategy Registry → Data/Portfolio → Core Models
    All dependencies point inward toward core/ (models, interfaces).

  key_patterns:
    - Strategy Pattern: Polymorphic signal generation via Strategy ABC
    - Registry Pattern: Decorator-based auto-registration
    - Adapter Pattern: DataProvider abstraction (fetcher vs test mocks)
    - Template Method: Strategy.initialize/teardown default implementations

  data_flow: |
    fetch command → ccxt → cache merge → filter by range → return candles
    backtest command → fetch candles → sliding window → strategy signal → portfolio → metrics → save JSON

  package_structure: |
    src/cryplative/
      cli.py              # Entry point
      config.py           # Pydantic-settings config
      core/               # Models (Pydantic), interfaces (ABC), exceptions
      market_fetcher/     # Data acquisition via ccxt + JSON cache
      strategies/         # Registry, indicators, implementations, template
      backtesting/        # Engine, comparison utilities
      portfolio/          # Multi-position tracking
      catalog/            # SQLite results index (db.py, query.py, __init__.py)

# =============================================================================
# GOTCHAS (NOT OBVIOUS FROM CODE)
# =============================================================================

gotchas:
  path_resolution: |
    get_project_root() walks UP to find CLAUDE.md. This means data/ paths resolve
    to cryplative/ project root, NOT platform/. Tests override via CryplativeConfig.

  documentation_location: |
    Researcher documentation moved from platform/docs/ to platform_docs/ at project root
    (2026-05-06). This makes docs accessible to all agents. No references in Python code.

  registry_mutation: |
    StrategyRegistry uses class-level mutable dict. NOT thread-safe. Must call
    clear() in test setup to prevent cross-test pollution.

  close_time_calculation: |
    _ohlcv_to_candle computes close_time = open_time + interval_ms - 1.
    Interval lookup only supports m/h/d/w suffixes. Defaults to 1h (3600000ms).

  pagination_since_increment: |
    In MarketFetcher, pagination increments current_since by last_candle.open_time + 1.
    This avoids duplicates from ccxt. Critical for merging cache correctly.

  equity_always_recorded: |
    Equity curve recorded every candle, not just on trades. Grows linearly with
    number of candles. Could be memory-intensive for very long backtests.

  force_close_at_end: |
    Backtest force-closes at LAST candle's close price, not a separate exit.
    Can affect metrics if last signal was BUY just before data ends.

  sharpe_annualization: |
    Uses sqrt(N) where N = number of trades. Common but debatable approach.
    More accurate: use periodic returns (daily/hourly) but requires more data.

  domain_restriction_scope: |
    platform-developer is restricted to platform/ folder only. Root-level operations
    blocked by access control hook. Tasks requiring root access include:
    - Creating .venv at project root
    - Modifying root .gitignore
    - Running pip install referencing root-level paths
    - Any bash command touching paths outside platform/
    Workaround: Write execution specs to .agentic/specs/ for CTO or ops agent.

  root_venv_setup: |
    Research team needs root-level .venv with editable install of platform/ package.
    Steps (must be done by agent with root access):
    1. Add '.venv/' to root .gitignore (Python section)
    2. python3 -m venv .venv at project root
    3. pip install -e platform/ (installs cryplative package in editable mode)
    4. Verify imports work: cryplative.config, cryplative.core.models, cryplative.market_fetcher.fetcher,
       cryplative.strategies.indicators, cryplative.backtesting.engine

  negative_capital_allowed: |
    PortfolioTracker.open_position() allows capital to go negative. Logs warning
    but doesn't prevent trade. Intentional for Phase 1 simplicity.

  phase2.5_spec002_validation: |
    Validated SPEC-002 against codebase before implementation. Key findings:
    - ccxt market dict uses bracket access: market['precision']['price'], not market.precision.price
    - PortfolioTracker uses 'cost' (open) and 'proceeds' (close), not 'trade_value'
    - BacktestConfig is plain class, StrategyMetrics is Pydantic BaseModel
    - All indicator signatures use list[float] input, list[float | None] output
    - ATR signature exception: takes (highs, lows, closes) not just closes

  spec004_strategy_result_gaps: |
    StrategyResult model lacks symbol and interval fields. These are on BacktestConfig instead.
    Critical impact: any integration that consumes StrategyResult (catalog, API, reports) cannot
    determine market context without additional parameters.
    - symbol: available via trades[0].signal.symbol (if trades exist), but not top-level
    - interval: NOWHERE in StrategyResult or the JSON output — only in BacktestConfig and filename
    Workaround: pass symbol/interval as separate parameters alongside StrategyResult.
    Future fix: add symbol and interval fields to StrategyResult model.

  spec004_json_result_file_structure: |
    JSON result files are NOT self-describing for market context. Top-level fields:
    strategy_id, run_type, start_date, end_date, parameters, trades, metrics, created_at.
    Missing: symbol, interval. Must parse filename for interval and/or trades for symbol.
    Filename format: {strategy_id}_{symbol_slash_to_underscore}_{interval}_{start}_{end}.json
    Date format in filename varies: some use "2025-01-01" others "2024-01-01T00:00:00Z"
    depending on what was passed to --start/--end.
    Non-standard files also exist in strategy_results/: H2-detailed-results.json, H2-report.md.
    Any directory scanner must skip these gracefully.

  spec004_typer_subcommand_groups: |
    Typer does NOT support nested commands via @app.command(). To create a command group
    with subcommands (e.g., "cryplative results list"), use app.add_typer() pattern:
      sub_app = typer.Typer(help="...")
      app.add_typer(sub_app, name="results")
      @sub_app.command("list")
      def results_list(...): ...
    This is the first subcommand group in the CLI. All existing commands are leaf commands.

  spec004_db_unique_constraint: |
    SQLite CREATE INDEX does NOT enforce uniqueness. Must use either:
    - Column constraint: results_file TEXT NOT NULL UNIQUE
    - Or: CREATE UNIQUE INDEX idx_results_file ON results(results_file)
    Regular CREATE INDEX allows duplicates — sqlite3.IntegrityError will NOT fire.

  spec004_rich_empty_style:
    insight: |
      Rich console markup f"[{style}]{text}[/{style}]" breaks when style is empty string.
      Empty style produces "[]" and "[/]" which raises MarkupError.
    fix: |
      Use conditional: if style: f"[{style}]{text}[/{style}]" else: text
      Or use a named style like "bold" / "not bold" instead of empty string.

  spec004_max_drawdown_sorting:
    insight: |
      max_drawdown_pct is stored as negative values (e.g., -0.42, -10.0).
      "Best" drawdown = closest to 0 (least negative) = highest value numerically.
      Therefore max_drawdown_pct should be in HIGHER_IS_BETTER set (sort DESC).
      The spec says "lower is better" which is semantically correct for drawdown magnitude,
      but since values are stored as negatives, SQL DESC puts the best first.

  spec004_catalog_module_structure:
    insight: |
      catalog/ module has 3 files: __init__.py (exports), db.py (schema + dataclasses),
      query.py (ResultsCatalog class with all methods). This separation keeps schema
      concerns separate from query logic. init_db() is in db.py and called by constructor.

  spec004_rebuild_filename_parsing:
    insight: |
      Two filename patterns exist in strategy_results/:
      1. Engine format: {strategy_id}_{BASE}_{QUOTE}_{interval}_{start}T00:00:00Z_{end}T23:59:59Z.json
      2. Old format: {strategy_id}_{BASE}_{QUOTE}_{interval}_{start}_{end}.json
      Non-matching files (H2-detailed-results.json) are silently skipped via _parse_filename().
      Files matching a pattern but with invalid JSON are counted as parse errors.

  spec004_backtest_catalog_integration:
    insight: |
      Catalog insert happens in the CLI layer, NOT in the engine. The engine's job is
      just running backtests. The CLI uses build_results_path() to construct the path
      since engine.run() returns StrategyResult (not the saved path). The engine's
      _save_result() now returns the path string but run() doesn't capture it.

# =============================================================================
# DECISIONS & TRADEOFFS
# =============================================================================

decisions:
  pydantic_v2: |
    Chosen for data models. Provides validation, JSON serialization, type safety.
    Tradeoff: Learning curve, but worth it for error prevention.

  json_file_storage: |
    No database. One file per symbol/interval for cache, one per backtest result.
    Tradeoff: Simple, human-readable, but doesn't scale to millions of results.

  structlog: |
    Structured logging throughout. JSON or console output.
    Tradeoff: Slightly more verbose, but enables log parsing/analysis.

  pure_function_indicators: |
    All indicators are pure functions (no class state).
    Tradeoff: No memoization, but simple, testable, thread-safe.

  ccxt_for_exchange_abstraction: |
    Exchange-agnostic API via ccxt library.
    Tradeoff: Adds dependency, but supports 100+ exchanges with one interface.

  ruff_not_black_flake8: |
    Ruff for linting + formatting (replaces black, flake8, isort).
    Tradeoff: Newer tool, but much faster and unified config.

# =============================================================================
# TESTING PATTERNS
# =============================================================================

testing:
  fixtures: |
    conftest.py provides sample_candles with known patterns (crossover, oversold/overbought).
    Tests use these for deterministic signal generation.

  reference_values: |
    Indicator tests use exact outputs from spec-defined inputs.
    Catchs regressions in computation logic.

  isolation: |
    StrategyRegistry.clear() in setup_method + sys.modules cleanup for auto-discovery tests.
    Prevents cross-test pollution from mutable class state.

  coverage_target: |
    Phase 2 target: 85%. Achieved: 96%.
    Higher coverage possible but diminishing returns.

# =============================================================================
# TECHNICAL DEBT
# =============================================================================

debt:
  critical:
    - PortfolioTracker allows negative capital (no guard)
    - No risk management (stop-loss, max position size, drawdown limits)
    - Long-only (no short selling)
    - Quantity hardcoded to 1.0 (no dynamic sizing)

  moderate:
    - BacktestConfig is plain class (not Pydantic) — no validation
    - Sharpe ratio uses trade returns, not periodic returns
    - Execution at candle close only (no open/high/low simulation)
    - No fee/commission or slippage modeling

  minor:
    - pandas declared but unused
    - No .env.example file
    - StrategyRegistry not thread-safe
    - No async I/O (all synchronous)
    - No root-level .venv for cross-team imports (blocked by domain restriction)

