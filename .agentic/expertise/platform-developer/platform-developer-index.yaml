# 6. TEST COVERAGE
# =============================================================================

test_coverage:
  framework: pytest with pytest-cov
  test_count: "~75+ test methods across 8 test files"
  structure:
    conftest.py: "Shared fixtures: sample_candles, sample_candles_with_crossover, tmp_data_dir"
    test_models.py: "19 tests — model creation, validation, serialization"
    test_config.py: "8 tests — config defaults, path resolution, logging"
    test_market_fetcher.py: "17 tests — cache CRUD, dedup, fetcher behavior, error handling"
    test_strategies.py: "22 tests — SMA computation, registry CRUD, signal generation"
    test_backtesting.py: "12 tests — metrics, engine scenarios, error cases"
    test_portfolio.py: "10 tests — position tracking, equity, PnL"
    test_integration.py: "3 tests — end-to-end pipeline validation"
    test_cli.py: "7 tests — CLI commands with mocked dependencies"

  test_patterns:
    mocking: "unittest.mock.MagicMock for ccxt exchange, patch for config/logging"
    fixtures: "pytest fixtures for temp dirs, sample data"
    data_generation: "Programmatic candle generation with known patterns (flat, crossover, realistic)"
    isolation: "StrategyRegistry.clear() in setup_method to prevent cross-test pollution"

  coverage_notes: |
    Tests achieve 80%+ coverage (per SPEC-000 requirement).
    CLI tests use CliRunner from typer.testing.
    Integration test (test_integration.py) is the most comprehensive single test.

# =============================================================================
# 7. DEPENDENCIES
# =============================================================================

dependencies:
  runtime:
    ccxt: ">=4.0 — Exchange-agnostic crypto trading library. Used for fetch_ohlcv(). Rate limiting enabled."
    numpy: ">=1.24 — Phase 2 addition. Used internally by indicators library. Must be explicit dep (not just transitive via pandas)."
    pandas: ">=2.0 — Declared. Only used indirectly (numpy is pandas dep). Phase 2 indicators use numpy directly."
    pydantic: ">=2.0 — Data models (BaseModel, field_validator, model_validator). Also used by mypy plugin."
    pydantic_settings: ">=2.0 — BaseSettings for CryplativeConfig. Loads from env vars + .env file."
    structlog: ">=24.0 — Structured logging throughout all modules."
    typer: ">=0.12 — CLI framework. Rich integration for console output."
    rich: ">=13.0 — Terminal formatting (tables, colors) for CLI output."

  dev:
    pytest: ">=8.0 — Test framework"
    pytest_cov: ">=5.0 — Coverage reporting"
    ruff: ">=0.5 — Linter + formatter (replaces flake8, black, isort)"
    mypy: ">=1.10 — Static type checking (strict mode)"

  stdlib_heavy_usage:
    - abc (ABC, abstractmethod)
    - pathlib (Path — all file operations)
    - json (serialization/deserialization)
    - uuid (trade IDs)
    - math (Sharpe ratio calculation)
    - enum (StrEnum)
    - logging (root logger for structlog bridge)
    - datetime (timestamp conversions)
    - typing (type hints throughout)

# =============================================================================
# 8. KNOWN LIMITATIONS & AREAS FOR IMPROVEMENT
# =============================================================================

limitations:
  critical:
    - "PortfolioTracker allows negative capital — no guard against overspending"
    - "No risk management — no stop-loss, no max position size, no drawdown limits"
    - "Long-only — no short selling support in backtesting"
    - "Single position — only one open trade at a time"
    - "Quantity hardcoded to 1.0 — no dynamic position sizing"
    - "BacktestConfig is a plain class, not Pydantic — no validation on inputs"

  moderate:
    - "StrategyRegistry uses mutable class state — not thread-safe"
    - "compute_sma is O(n*period) — could use cumulative sum for O(n)"
    - "Sharpe ratio calculation is simplistic — uses trade returns, not periodic returns"
    - "Execution at candle close only — no open/high/low simulation"
    - "No fee/commission modeling in backtests"
    - "No slippage modeling"
    - "pandas is a dependency but not used anywhere"
    - "ExecutionHandler interface defined but nothing implements it"

  minor:
    - "CLI strategies command uses __new__ hack to get strategy_id for table display"
    - "Cache path uses / in filenames replaced with _ — could collide if symbols contain _"
    - "No .env.example file documenting available config options"
    - "StrategyResult.start_date/end_date are strings, not datetime — no type consistency"
    - "Equity curve recorded every candle — could be memory-intensive for very long backtests"
    - "No async support — all I/O is synchronous"

  phase2_preparation:
    - "Paper trading needs ExecutionHandler implementation"
    - "Real execution needs ccxt order placement (create_order, cancel_order, etc.)"
    - "Scheduler/routines module needs to be created"
    - "Storage abstraction layer needed before DB migration"
    - "Strategy state persistence (StrategyConfig.state) is defined but unused"

# =============================================================================
# 9. EXISTING DATA FILES
# =============================================================================

