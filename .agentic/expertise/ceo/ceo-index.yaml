# CEO Expertise Index
# Agent: ceo
# Domain: Company strategy, team coordination, goal tracking, high-level decision making

hierarchy:
  manager: "none — reports to Javi (human founder)"
  subordinates: [cto, claude-developer, head-of-research]
  planned_hires:
    head-of-research:
      title: "Head of Quantitative Research"
      role: "Manager of the algorithmic trading research team"
      reports_to: "ceo"
      manages: ["strategy-implementer"]
      reasoning: "Research IS the core function — needs scientific rigor, pipeline coordination, and authority"
      status: "hired — agent operational, reporting to CEO, no subordinates yet"
    strategy-implementer:
      title: "Strategy Implementer"
      role: "Implements and backtests trading strategies on the platform"
      reports_to: "head-of-research"
      manages: []
      reasoning: "First researcher hire — can use platform's data fetching directly (no dedicated data agent needed). Receives strategy specs, codes them, runs backtests, validates behavior."
      status: "hired — agent operational at .claude/agents/strategy-implementer.md, reports to head-of-research"
  future_teams:
    - name: "algorithmic trading research team"
      manager: "head-of-research"
      status: "operational — manager active, strategy-implementer hired and active"
      needed_roles: ["strategy implementation/testing"]
      not_needed: ["data acquisition — platform handles this directly, no dedicated agent required"]
      future_roles: ["portfolio & risk management — hire after 3+ validated strategies"]
    - name: "trading team"
      status: "future — execute trades, manage real & paper portfolios, monitor live performance"

company:
  name: "Cryplative"
  mission: "Grow capital aggressively but sustainably via crypto algorithmic trading"
  approach: "Scientific, data-driven, systematic research — iterate based on evidence"
  differentiator: "Entirely run by AI agents with one human (Javi) overseeing"

organization:
  human:
    name: "Javi"
    role: "Founder — oversees operations, makes high-level decisions"
  current_team:
    cto:
      role: "Oversees engineering team, designed platform architecture"
      report_to: "ceo"
    platform_developer:
      role: "Builds the trading platform"
      report_to: "cto"
      status: "Platform operational with basic features"
  expertise_file: ceo-organization.yaml

  hiring:
    agent: "claude-developer"
    capability: "Only agent that can hire other agents for the company"
    info_needed: ["agent name", "purpose", "manager", "subordinates"]
    note: "Delegate hiring tasks to claude-developer with complete role definition"
    isolation: "claude-developer is business-isolated — only give it structural/infrastructure tasks, never business logic"

trading_constraints:
  exchange: "Binance"
  pairs: "USDC only (EU jurisdiction restriction)"
  position_type: "Spot only, long only, no leverage"
  intervals: ["1h", "4h", "1d", "1w"]
  philosophy: "Per-pair strategies — no one-size-fits-all. Every pair has unique characteristics."
  research_note: "Can use USDT pairs for research (more data), implement on USDC pairs (similar behavior)"

communication:
  mechanism: "Async text files in .agentic/specs/ subfolders — agents read/write files to share updates"
  channels:
    managers:
      path: ".agentic/specs/managers/"
      purpose: "Cross-team manager communication (CEO, CTO, Head of Research)"
      access: [ceo, cto, head-of-research]
    engineering:
      path: ".agentic/specs/engineering/"
      purpose: "Engineering team specs and updates (CTO, claude-developer)"
      access: [cto, claude-developer]
    research:
      path: ".agentic/specs/research/"
      purpose: "Research team specs and updates (head-of-research + research team members)"
      access: [head-of-research, "research team members"]
  direct_communication: "claude-developer — communicate directly via delegation, no need for spec files"

architectural_boundaries:
  engineering_team:
    owns: "platform/"
    produces: "Tools, libraries, APIs — an importable toolkit for strategy implementation and backtesting"
    principle: "Platform should never limit research — dev team can be asked to improve it"
    rule: "No strategies, data, or research output lives in platform/ — it is purely a toolkit"
  research_team:
    owns: "data/"
    produces: "Strategies, downloaded market data, historical indicators, backtesting results, performance metrics"
    uses: "Imports platform tools (from platform/) as a library, but ALL output stored in data/"
    rule: "All research artifacts live in data/ — strategies, results, data, everything"
  dependency: "Research team depends on platform as importable toolkit. If platform doesn't support this workflow, CTO must update it."

platform:
  language: "Python"
  modules: ["MarketFetcher", "Strategies", "Backtesting", "Portfolio Mgmt", "Real Execution", "Paper Trading", "Routines"]
  monitoring: "React/chadcn-ui webapp + bun.js API serving filesystem data"
  supports: ["market orders", "limit orders", "stop loss", "take profit"]

current_status:
  phase: "SPEC-004 catalog shipped — H5 spec writing is the next priority"
  platform: "Operational — catalog module added, engine updated, CLI expanded, docs written"
  immediate_priorities:
    - "H5 (ADX + SMA filter) — delegate to head-of-research to write spec and assign to strategy-implementer"
    - "Validate SPEC-004 catalog with real research data"
  execution_sequence:
    step_1:
      what: "H2 implementation (RSI divergence + trend filter)"
      result: "REJECTED — too few signals (3 test trades, needed 20+)"
      commit: "strategy in data/strategies/rsi_divergence_trend.py"
      status: "DONE — REJECTED"
    step_2:
      what: "Root .venv with pip install -e ./platform"
      result: "All 22 modules importable cleanly, uv-provided Python 3.12.13"
      commit: "8368556"
      status: "DONE"
    step_3:
      what: "Platform docs update at /platform_docs"
      result: "8 files updated, new public-api.md created"
      commit: "b4c646b"
      status: "DONE"
    step_4:
      what: "Remove sys.path hacks from data/"
      result: "Both files cleaned, zero sys.path references remain"
      commit: "b5c8949"
      status: "DONE"
    step_5:
      what: "SPEC-004 Strategy Results Catalog — cross-team review"
      result: "CTO wrote spec v1, research lead reviewed (APPROVE_WITH_SUGGESTIONS), CTO updated to v2 incorporating all feedback"
      status: "DONE — spec aligned"
    step_6:
      what: "SPEC-004 Strategy Results Catalog — implementation"
      result: "5 commits: catalog module (db.py + query.py), CLI commands, engine update (--catalog flag), pandas export, docs. 3684 lines added."
      status: "DONE — shipped across commits 1a280d6..2c91d91"
  next_steps:
    - "H5 (ADX + SMA filter) — delegate to head-of-research to write spec + assign to strategy-implementer"
    - "Validate SPEC-004 catalog with real backtest data (rebuild against existing results)"
    - "Define measurable targets for aggressive growth (profit, risk, drawdown metrics)"
    - "Define risk management framework"
    - "Consider H1 (Vol breakout + volume) after H5"

open_decisions:
  - question: "What does 'aggressive growth' mean in measurable terms?"
    status: "undefined"
    needs: "Target metrics for returns, risk, max drawdown"
    defaults_in_use: ">40% annualized, -20% max drawdown, $10K initial capital"
  - question: "Risk management framework"
    status: "undefined"
    needs: "Systematic way to evaluate and mitigate strategy risk"
  - question: "Algorithmic trading research team structure"
    status: "decided and aligned"
    detail: "No data-acquisition agent. Strategy-implementer is first hire. Head-of-research running spec-first loop."
  - question: "Which trading pairs to start with"
    status: "partially defined"
    detail: "H2 spec uses BTC, ETH, SOL, LINK (USDT for research). List-pairs feature now available — full universe discovery can proceed."

platform_feature_requests:
  - feature: "List all available Binance spot pairs (MarketFetcher.list_pairs() + cryplative pairs CLI)"
    purpose: "Filter and select USDC pairs for our trading universe"
    status: "shipped — commit 8fe4034, includes --quote USDC filtering and --sort-by volume"
    blocking: "resolved"
  - feature: "Cache layer for fetched market data"
    purpose: "Avoid redundant API calls during research and backtesting"
    status: "confirmed working — file-based JSON cache, transparent to caller, auto-deduplication"
    blocking: "resolved"
  - feature: "Strategy Results Catalog (SPEC-004)"
    purpose: "SQLite index over strategy backtest JSON files for querying, comparing, and analyzing results across strategies"
    status: "shipped — 5 commits (1a280d6..2c91d91), catalog module + CLI + engine integration + docs"
    spec: ".agentic/specs/engineering/004-strategy-results-catalog.md"
    review: ".agentic/specs/research/catalog-spec-review.md"
    response: ".agentic/specs/engineering/004-review-response.md"
    key_features:
      - "ResultsCatalog Python API (find, best, compare_hypotheses, summary, tag)"
      - "CLI commands: cryplative results list/best/compare/summary/show/tag/rebuild/delete"
      - "data_split tracking (TRAIN/TEST/FULL) for research methodology"
      - "experiment_id for grouping parameter sweeps"
      - "fees_included boolean for result comparability"
      - "Metric threshold filtering (min_sharpe, min_return_pct, etc.)"
      - "Engine returns saved file path for clean catalog integration"
    blocking: "none — ready to build"

research_team_status:
  head_of_research:
    status: "active — awaiting next assignment (H5 spec writing)"
    current_work: "H2 complete and rejected. Reviewed SPEC-004 catalog spec (APPROVE_WITH_SUGGESTIONS). Needs to write H5 spec and assign to strategy-implementer."
  strategy_implementer:
    status: "active — idle, awaiting next assignment"
    current_task: "None — H2 rejected, waiting for H5 assignment"
    workspace: "data/ — all implementation and results stored here"
  pipeline:
    current: "STALLED — H5 spec not yet written"
    next: "H5 (ADX + SMA filter) — spec needs to be written by head-of-research"
    later: "H1 (Vol breakout + volume)"
    validation: "After 2+ strategies tested — compare and validate promising ones"
  lesson_from_h2: "RSI divergence produced too few signals (3 trades vs 20+ minimum). Signal frequency matters as much as signal quality — a strategy must produce enough trades to be statistically meaningful."
