# Claude Developer Expertise Index
# Agent: claude-developer
# Domain: Claude Code extension development (.claude directory)

project_setup:
  conventions:
    - "Expert agents defined in .claude/agents/ as markdown with YAML frontmatter"
    - "Expertise stored in .claude/expertise/{agent-name}/ as YAML files"
    - "Skills in .claude/skills/{skill-name}/ with SKILL.md and optional scripts/"
    - "Hooks in .claude/scripts/ (e.g., enforce-agent-access.ts)"
    - "Hook scripts live in .claude/hooks/ (e.g., session-logger.ts)"
    - "TypeScript scripts use bun runtime"
  dependencies:
    - "js-yaml (in .claude/package.json)"
    - "@types/bun (devDependency, required for Bun API type resolution)"
  quality_checks:
    typecheck: "bun run typecheck (runs tsc --noEmit via node_modules/.bin/tsc)"
    lint: "bun run lint (runs eslint . via node_modules/.bin/eslint)"
    config: "eslint.config.js uses @eslint/js + typescript-eslint with recommended configs"
    note: "Always run typecheck and lint after making changes to .claude code. Fix all errors before finishing."
    gotchas:
      - "Do NOT use '2>&1' in bash commands when the claude-developer agent is active — the enforce-agent-access hook matches '>' as a write redirect pattern"
      - "When adding 'type: module' to package.json, eslint.config.js must use ESM syntax (import/export), not require()"
  dev_dependencies:
    - "typescript — provides tsc for type checking"
    - "eslint + @eslint/js + typescript-eslint — provides linting"
    - "@types/node — required for 'types: [\"node\"]' in tsconfig to resolve Node type definitions"
  tsconfig:
    path: ".claude/tsconfig.json"
    note: "Must include both 'bun' and 'node' in 'types' array so the IDE resolves both Bun and Node type definitions"
    key_options:
      - '"types": ["bun", "node"] -- critical for mixed Bun/Node usage'
      - '"moduleResolution": "bundler", "module": "esnext", "target": "esnext"'
      - '"skipLibCheck": true, "noEmit": true'

bun_runtime_patterns:
  spawn_processes: "Use Bun.spawn() instead of node:child_process. Returns a Subprocess with stdout/stderr as ReadableStream, and .exited as a Promise<number>"
  file_exists: "Use Bun.file(path).exists() instead of fs.existsSync(). Returns Promise<boolean>"
  stdin_reading: "Use Bun.stdin.text() for reading all stdin as text (returns Promise<string>)"
  fs_promises_ok: "appendFile, mkdir, readFile from 'node:fs/promises' work fine in Bun -- no need for Bun-specific alternatives"
  env_access: "Bun.env is the equivalent of process.env"
  gotchas:
    - "existsSync is in 'node:fs' NOT 'node:fs/promises' -- easy mistake when importing"
    - "When using Bun APIs (Bun.spawn, Bun.file, etc.), @types/bun must be installed or the IDE will show type errors"
    - "Bun.spawn stdout/stderr are ReadableStream, not Buffer -- use 'await new Response(child.stdout).text()' to read them"
    - "Bun.spawn accepts env as an object spread from Bun.env, not just process.env"

delegation_system:
  expertise-file: delegation-system.yaml
  summary: "System for inter-agent communication via the delegate skill. One agent delegates a task to another, the child runs in its own claude process, and all communication is logged to a shared session file."
  key_components:
    - name: delegate skill
      path: ".claude/skills/delegate/"
      structure: "SKILL.md + scripts/delegate.ts + scripts/reference.md"
    - name: session directory
      path: ".claude/sessions/<CRYPLATIVE_SESSION_ID>/"
      files:
        - "_conversation.jsonl (user_prompt/initial_prompt/response/delegation entries)"
        - "_metadata.json (run_id, agent_name, transcript_path — used for cross-hook state)"
        - "agent_logs/ directory — contains raw conversation transcripts per agent run"
      note: "_metadata.json is necessary because CLAUDE_ENV_FILE exports don't propagate to hook processes. It stores the session's run_id so all hooks can read it consistently."
    - name: session state directory
      path: ".claude/sessions/.state/<claude_session_id>.json"
      purpose: "DEPRECATED — no longer needed. Session ID is now derived deterministically from input.session_id in all hooks, so no shared state is required."
      note: "Can be removed in future cleanup."
    - name: session ID propagation
      mechanism: "CRYPLATIVE_SESSION_ID env var is passed from parent to child claude process via Bun.spawn env spread"
    - name: agent run ID
      mechanism: "6-char random alphanumeric string (generateRunId) that uniquely identifies each agent run. Main agent gets one per session (generated in SessionStart). Sub-agents get a fresh one per invocation (generated in SubagentStop/delegate.ts). Stored in _metadata.json and passed to child processes via CRYPLATIVE_AGENT_RUN_ID env var."
      storage:
        - "_metadata.json — cross-hook persistence for main agent"
        - "_conversation.jsonl — agent_run_id field in entries"
        - "agent_logs/{agent-name}-{run_id}.jsonl — raw transcript filename"
    - name: agent_logs directory
      path: ".claude/sessions/<CRYPLATIVE_SESSION_ID>/agent_logs/"
      contents: "One JSONL file per agent run: {agent-name}-{run_id}.jsonl"
      format: "Only user and assistant messages. Each line is just the message object (e.g. {role, content}). System messages, tool_use, tool_result, result events are all filtered out."
      sources:
        - "delegate.ts: stream-json output from --output-format stream-json, filtered to type=user|assistant, keeping only the message field"
        - "Stop hook: reads main session transcript, filters to role=user|assistant"
        - "SubagentStop hook: reads subagent transcript, filters to role=user|assistant"
      note: "delegate.ts filters stream-json events (type+message format) extracting only message. Hooks filter Claude transcripts (role+content format) keeping matching lines."
    - name: CLAUDE_ENV_FILE
      note: "Exports written here by SessionStart hook propagate to Bash tool commands but NOT to other hook processes"
  conversation_log_format:
    file: "_conversation.jsonl"
    entry_types:
      - type: user_prompt
        fields: "type, timestamp, agent, prompt, agent_run_id"
        source: "session-logger hook (UserPromptSubmit)"
        note: "Used in interactive mode. ALL user prompts are logged (no guard). agent_run_id is the main agent's run ID from _metadata.json."
      - type: initial_prompt
        fields: "type, timestamp, agent, prompt, agent_run_id"
        source: "session-logger hook (UserPromptSubmit)"
        note: "Used in print mode (-p flag). Only logged once per session (hasInitialPromptEntry checks file content for existing entry). Detected via CRYPLATIVE_PRINT_MODE env var set by delegate.ts."
      - type: summary
        fields: "type, timestamp, agent, response_preview (first 500 chars), agent_run_id"
        source: "session-logger hook (Stop) — main agent's final response"
        note: "Only written by the Stop hook in non-delegated mode. Represents the agent's final answer for the session. In print mode this is always the last entry. In interactive mode, each Stop produces a summary (we cannot know ahead of time which is the final one)."
      - type: response
        fields: "type, timestamp, agent, response_preview (first 500 chars), delegation_id (when from delegation), exit_code (when from delegate.ts), agent_run_id"
        sources:
          - "session-logger hook (SubagentStop) — internal subagent response (fresh run_id per invocation)"
          - "delegate.ts script — child agent response after /delegate skill call (fresh run_id per invocation)"
        note: "Used for delegated agent responses. Linked to a delegation entry via delegation_id. agent_run_id identifies the specific run of the responding agent."
      - type: delegation
        fields: "type, timestamp, agent, delegated_to, delegation_type (skill|internal), prompt, delegation_id, agent_run_id"
        sources:
          - "delegate.ts script (delegation_type='skill') — explicit /delegate skill calls"
          - "session-logger hook (SubagentStop) (delegation_type='internal') — Claude's internal subagent mechanism"
        note: "delegation_type differentiates explicit skill calls from Claude's internal subagent spawning. 'agent' is the delegating (parent) agent, 'delegated_to' is the target agent name."
    removed_fields_note: "to_agent, session_id, and claude_session_id were removed from all entry types — redundant or unused. 'from_agent' was renamed to 'agent'."
    note: "Append-only JSONL, safe for concurrent use. delegation_id links response to its delegation."
    mode_detection:
      mechanism: "CRYPLATIVE_PRINT_MODE env var set by delegate.ts in Bun.spawn env"
      interactive: "No CRYPLATIVE_PRINT_MODE → all UserPromptSubmit events logged as user_prompt (no guard)"
      print: "CRYPLATIVE_PRINT_MODE=1 → first UserPromptSubmit logged as initial_prompt (with hasInitialPromptEntry guard)"
      note: "Claude Code hook inputs do NOT include a field to distinguish -p from interactive mode. SessionStart input has: session_id, transcript_path, cwd, permission_mode, hook_event_name, source. UserPromptSubmit adds: prompt. No stop_on_submit or print_mode field exists."

access_control:
  hook: ".claude/scripts/enforce-agent-access.ts"
  pattern: "PreToolUse hook reads agent frontmatter 'access' block, matches tool paths against glob rules"
  verbs: ["read", "write", "delete"]
  behavior: "fail-closed -- deny if no access block, deny if no matching rule"
  tool_classification:
    read_tools: ["Read", "Grep", "Glob"]
    write_tools: ["Write", "Edit", "MultiEdit", "NotebookEdit"]
    bash: "Classified by regex patterns for delete/write/readonly; unknown tools are skipped (allowed)"
  path_resolution: "Resolves to absolute, then to relative from cwd. Rejects paths outside project (starting with ..)"
  agent_frontmatter_hook: "Agents declare hooks in frontmatter to trigger enforce-agent-access on Read|Write|Edit|MultiEdit|Bash"
  known_issues:
    - "Commands without resolvable file paths (e.g., 'claude agents', 'ls') get denied with 'without resolvable path' -- this is a limitation of the Bash classification logic"

validation_agents:
  expertise-file: validation-agents.yaml
  summary: "Primary and secondary test agents that exercise the delegation system. They have scoped access rules and use the enforce-agent-access hook."
  primary:
    path: ".claude/agents/primary.md"
    skills: ["delegate", "agent-expertise"]
    access: "read/write to .claude/sessions/**, full access to .claude/expertise/primary/**"
    role: "Delegates tasks to secondary, combines results"
  secondary:
    path: ".claude/agents/secondary.md"
    skills: ["agent-expertise"]
    access: "read-only to .claude/sessions/**, full access to .claude/expertise/secondary/**"
    role: "Receives delegated tasks, returns structured responses"

current_agents:
  - name: primary
    purpose: "Test agent that delegates tasks to secondary"
  - name: secondary
    purpose: "Test agent that receives delegated tasks"
current_skills:
  - name: claude-developing
    purpose: "Reference for Claude Code extension development"
  - name: agent-expertise
    purpose: "Manage structured YAML expertise files"
  - name: delegate
    purpose: "Delegate tasks to other agents with session logging"

observations:
  - date: "2026-05-02"
    note: "Implemented the delegation system end-to-end: delegate skill, session logging, validation agents (primary/secondary), and verified enforce-agent-access hook works with delegated agents"
  - date: "2026-05-02"
    note: "Learned that the enforce-agent-access hook needs to handle /dev/null path carefully -- bash redirects like '>/dev/null' can trigger path-outside-project denials"
  - date: "2026-05-02"
    note: "Bun.spawn env spread must include ...Bun.env plus any custom vars; Claude CLI picks up env vars from the spawn environment, not from shell profile"
  - date: "2026-05-02"
    note: "CLAUDE_ENV_FILE exports only propagate to Bash tool commands, NOT to other hook processes. Hooks fired after SessionStart (e.g., UserPromptSubmit) are separate processes that don't source CLAUDE_ENV_FILE. Solution: SessionStart writes a state file (._state-<claude_session_id>.json) that other hooks can read."
  - date: "2026-05-02"
    note: "When testing hooks that read env vars, must isolate from the test runner's own env. Use { ...process.env } spread but strip session vars. The test runner itself may have CRYPLATIVE_SESSION_ID set."
  - date: "2026-05-02"
    note: "Empty string env vars ('') are NOT nullish -- they pass the ?? check but fail truthiness checks. Use 'process.env.VAR || undefined' pattern to treat empty strings as missing."
  - date: "2026-05-02"
    note: "The Stop hook event fires when Claude finishes responding, providing last_assistant_message on stdin. Subagents get SubagentStop instead. Added Stop handler to session-logger to log agent responses."
  - date: "2026-05-02"
    note: "Removed _initial_prompt_logged marker file from session folders. Instead, hasInitialPromptEntry() reads the last 50 lines of _conversation.jsonl to check if an initial_prompt entry already exists. Keeps session folders clean with only _conversation.jsonl."
  - date: "2026-05-02"
    note: "Moved session state files from .claude/sessions/._state-<id>.json to .claude/sessions/.state/<id>.json. Hidden .state/ directory keeps the sessions folder listing clean."
  - date: "2026-05-02"
    note: "enforce-agent-access hook blocks bash commands containing '2>&1' because the '>' in '2>&1' matches the WRITE_BASH_PATTERNS redirect regex. Use plain claude commands without stderr redirection to avoid this."
  - date: "2026-05-02"
    note: "CRITICAL BUG FIX: getOrDeriveSessionId() in session-logger checked process.env.CRYPLATIVE_SESSION_ID before deriving from input.session_id. When running `claude -p` from Bash tool, the child process inherits the parent's CRYPLATIVE_SESSION_ID from the Bash environment (set via CLAUDE_ENV_FILE). This caused the child's hooks to write to the WRONG session directory (the parent's, which didn't exist). Fix: ALL hooks must ALWAYS derive session ID deterministically from input.session_id, never trust process.env.CRYPLATIVE_SESSION_ID. That env var is ONLY for delegate.ts (consumed via Bash tool env), not for hook processes."
  - date: "2026-05-02"
    note: "CLAUDE_ENV_FILE exports propagate to Bash tool commands AND to child processes spawned from those commands (e.g., `claude -p`). This means CRYPLATIVE_SESSION_ID leaks from parent to child claude processes. The fix was to stop trusting this env var in hook code and always derive from input.session_id."
  - date: "2026-05-02"
    note: "Claude Code hook inputs do NOT include any field to distinguish -p (print) mode from interactive mode. SessionStart provides: session_id, transcript_path, cwd, permission_mode ('default'), hook_event_name, source ('startup'). UserPromptSubmit adds: prompt. There is no stop_on_submit, print_mode, or mode field. Detection requires an env var approach."
  - date: "2026-05-02"
    note: "Updated conversation logging to store ALL user prompts in interactive mode (type: user_prompt, no guard). In print mode (-p), first prompt is logged as initial_prompt (with guard). Mode detection uses CRYPLATIVE_PRINT_MODE=1 env var set by delegate.ts in the Bun.spawn env. This env var is inherited by the child's hook processes (unlike CLAUDE_ENV_FILE exports which only propagate to Bash tool commands)."
  - date: "2026-05-02"
    note: "Enhanced SubagentStop handler to also log a 'delegation' entry before the 'subagent_stop' entry. This unifies inter-agent communication logging: both explicit /delegate calls and Claude's internal subagent mechanism now produce delegation entries in _conversation.jsonl. The parent agent is resolved via findParentAgent() (scans recent conversation entries for the last non-subagent from_agent), and the prompt is extracted via extractSubagentPrompt() (checks input.prompt and input.tool_input fields). Both entries share a delegation_id for correlation."
  - date: "2026-05-02"
    note: "FIX: SubagentStop input does NOT include the original prompt/task given to the subagent in input.prompt or input.tool_input. However, the input includes 'agent_transcript_path' which points to the subagent's own conversation transcript (e.g., ~/.claude/projects/.../subagents/agent-<id>.jsonl). Reading the first user message from this transcript gives us the exact prompt. Updated extractSubagentPrompt() to use agent_transcript_path instead of transcript_path (which is the parent's transcript)."
  - date: "2026-05-02"
    note: "FIX: SubagentStop last_assistant_message can contain thinking blocks, tool_use blocks, and other non-text content. Added extractCleanResponse() that handles: (1) JSON content block arrays — extracts only type=text blocks, (2) XML thinking/anticipation tags — strips them with regex, (3) plain text — passes through unchanged. The subagent_stop response_preview now uses the cleaned response."
  - date: "2026-05-02"
    note: "GOTCHA: enforce-agent-access hook parses echo command arguments as paths. Using 'echo \"{json}\" | bun hook.ts' fails because the JSON string is matched as a path. Workaround: write test input to a temp file or use a test script with Bun.spawn stdin pipe."
  - date: "2026-05-02"
    note: "FIX: Claude Code spawns internal subagents with empty agent_type (e.g., for background processing). These appeared as phantom delegations with to_agent:'' in the conversation log. Added guard in handleSubagentStop to skip entries when agent_type is empty."
  - date: "2026-05-02"
    note: "SubagentStop input fields (confirmed from real session): session_id, transcript_path (parent), agent_id, agent_type, hook_event_name, stop_hook_active, permission_mode, agent_transcript_path (subagent's own transcript), last_assistant_message. The agent_transcript_path is the key to extracting the prompt — it points to the subagent's JSONL conversation file at ~/.claude/projects/<project-hash>/<session-id>/subagents/agent-<agent-id>.jsonl"
  - date: "2026-05-02"
    note: "Cleaned up _conversation.jsonl entry schema: (1) Removed to_agent from all entries (redundant with delegation_id), (2) Renamed subagent_stop type to response (unified response type for all sources), (3) Added delegation_type='skill'|'internal' to delegation entries to differentiate trigger source, (4) Removed session_id and claude_session_id from all entries (never used by consumers). Also cleaned up delegate.ts by removing unused claudeSessionId parameter."
  - date: "2026-05-02"
    note: "Updated findParentAgent() to skip entries with delegation_type='internal' instead of checking for subagent_stop type or missing to_agent field. This is cleaner since delegation_type is the canonical discriminator now."
  - date: "2026-05-03"
    note: "Added agent run ID system (6-char random string) and agent_logs directory to the session folder. Each agent run gets a unique ID stored in _conversation.jsonl entries. Raw transcripts are saved to agent_logs/{agent-name}-{run_id}.jsonl. Main agent's run_id is generated in SessionStart and persisted in _metadata.json. Sub-agents get fresh run_ids per invocation."
  - date: "2026-05-03"
    note: "delegate.ts now uses --verbose --output-format stream-json and streams output line-by-line to agent_logs. The --verbose flag is REQUIRED for stream-json output with --print. Filters to only type=user|assistant events, keeping only the 'message' field. Uses ReadableStream reader (child.stdout.getReader() + TextDecoder). Extracts text response from stream-json 'result' event type, with fallback to concatenated assistant text blocks."
  - date: "2026-05-03"
    note: "Introduced _metadata.json in session folders to persist data across hook invocations. Needed because CLAUDE_ENV_FILE exports don't propagate to hook processes. Stores run_id, agent_name, and transcript_path. Read by UserPromptSubmit, Stop, and SubagentStop hooks."
  - date: "2026-05-03"
    note: "Stop and SubagentStop hooks filter Claude Code transcripts before writing to agent_logs — only keeping user and assistant messages (by role field). System, tool_use, tool_result, result entries are all stripped."
  - date: "2026-05-03"
    note: "CRYPLATIVE_AGENT_RUN_ID env var is used by delegate.ts to pass the run_id to child claude processes. The child's SessionStart hook checks for this env var and reuses it (instead of generating a new one) so all hooks in the child session use the same run_id. This is safe because the env var is set fresh per delegation invocation."
  - date: "2026-05-03"
    note: "CRITICAL: --output-format stream-json requires --verbose when used with --print. Without --verbose, the claude CLI exits with code 1 and the error message 'Error: When using --print, --output-format=stream-json requires --verbose'. The delegate.ts spawn command must include both --verbose and --output-format stream-json. Also added stderr diagnostic logging to delegate.ts — when child exit code is non-zero, stderr is printed to help debug future issues."
  - date: "2026-05-03"
    note: "enforce-agent-access hook blocks bash commands containing '2>&1' because the '>' in '2>&1' matches the WRITE_BASH_PATTERNS redirect regex. Use plain claude commands without stderr redirection to avoid this. Also, the extractBashTargets function treats '-name \"filename\"' as a file path, which can cause false denials for find commands."
  - date: "2026-05-03"
    note: "Added isSkillSetupMessage() filter to both delegate.ts and session-logger.ts filterTranscriptToAgentLogs(). Claude Code injects skill setup messages into subagents as user messages whose first content block starts with '<command-message>'. These can be very large (hundreds of lines of skill definitions) and are not relevant to the conversation. The filter skips user messages where content is a string starting with '<command-message>' or an array whose first element has type='text' and text starting with '<command-message>'. Handles leading whitespace via trimStart()."
  - date: "2026-05-03"
    note: "GOTCHA: enforce-agent-access hook blocks bash commands containing '2>&1' because the '>' in '2>&1' matches the WRITE_BASH_PATTERNS redirect regex `/>>?\\s*\\S/`. The '>' in '>&' matches as a redirect even though it's stderr redirection. Use plain claude commands without stderr redirection to avoid this when the claude-developer agent is active."
  - date: "2026-05-03"
    note: "BUG FIX: Race condition in agent_logs writing. The Stop hook's filterTranscriptToAgentLogs() reads the transcript file from disk, but the final assistant message may not have been flushed to the transcript yet when the hook fires. The hook receives last_assistant_message in its input (in memory), but the on-disk transcript lags by one entry. Fix: added optional lastAssistantMessage parameter to filterTranscriptToAgentLogs(). After filtering the transcript, if the last filtered entry is not role='assistant', the function appends an assistant entry using the hook input's last_assistant_message (cleaned via extractCleanResponse). Both handleStop and handleSubagentStop now pass the cleaned response. No duplicates when transcript already has the final assistant message."
  - date: "2026-05-03"
    note: "The race condition in agent_logs affected both main agent and delegated child agent logs. For the main agent, the transcript ended with a tool_result (user role) and the final assistant summary was missing. For delegated children, the transcript only had the user prompt and the assistant response was missing. The fix ensures the last_assistant_message from the Stop/SubagentStop hook input always makes it into agent_logs, regardless of transcript flush timing."
  - date: "2026-05-03"
    note: "Added typecheck and lint commands to .claude/package.json. typecheck runs 'tsc --noEmit' and lint runs 'eslint .'. Both use binaries from node_modules (not bunx). Fixed 17 lint errors: unused imports/variables across test files, unnecessary escape in regex, unused function. Added 'type: module' to package.json for ESM eslint config. Added @types/node as devDependency (required by tsconfig 'types: [\"node\"]'). Added eslint, @eslint/js, typescript-eslint, and typescript as devDependencies."
  - date: "2026-05-03"
    note: "BUG FIX: CLAUDE_AGENT_NAME env var leaked from parent to child in nested delegations. When global delegated to primary, and primary delegated to secondary, both delegation entries had from_agent='global'. Root cause: delegate.ts spread Bun.env (inheriting parent's CLAUDE_AGENT_NAME=global) but didn't override it with the target agent name. Fix: (1) delegate.ts now sets CLAUDE_AGENT_NAME=<target-agent> in child spawn env, (2) session-logger SessionStart now writes CLAUDE_AGENT_NAME to CLAUDE_ENV_FILE even for delegated sessions. Belt-and-suspenders: the env var from Bun.spawn propagates to the child process, and the CLAUDE_ENV_FILE export propagates to the child's Bash tool commands."
  - date: "2026-05-03"
    note: "Improved _conversation.jsonl entry schema: (1) Renamed 'from_agent' field to 'agent' across all entry types in both session-logger.ts and delegate.ts, (2) Added 'delegated_to' field to delegation entries containing the target agent name, (3) Changed the main agent's Stop event to produce type 'summary' instead of 'response' — 'response' is now reserved for delegated agent responses only. Updated findParentAgent() to read 'agent' field instead of 'from_agent'. Updated all tests to match."

testing_system:
  expertise-file: testing-system.yaml
  summary: "Test framework for Claude Code extensions. Unit tests pipe JSON hook inputs via stdin and inspect files in temp directories. Integration tests call the claude CLI and verify session logs. Runner at .claude/tests/runner.ts discovers and executes all test suites."
  key_components:
    - name: test runner
      path: ".claude/tests/runner.ts"
      usage: "bun .claude/tests/runner.ts [--unit|--integration|--all] [--filter <name>] [--list] [--no-cleanup] [--timeout <ms>]"
      note: "Imports all test suites, runs them sequentially, reports pass/fail with timing. Exits 0 on success, 1 on failure, 2 on runner error."
    - name: helpers
      path: ".claude/tests/helpers.ts"
      exports: "runHook, runScript, runClaude, runClaudeIntegration, createTempProject, cleanupTempProject, getSessionDirs, readConversationLog, readMetadata, cleanupSessions, assert*, assertEqual, assertIncludes, etc."
    - name: unit tests
      path: ".claude/tests/*.test.ts (category: 'unit')"
      note: "Test hooks/scripts by piping JSON to stdin and inspecting output files. Use temp project dirs to avoid polluting real sessions. Fast (~600ms for all)."
    - name: integration tests
      path: ".claude/tests/*.test.ts (category: 'integration')"
      note: "Call real claude CLI, verify session creation and access control. Slower (~50s for all). Each test snapshots sessions before/after and cleans up new dirs."
  bun_spawn_gotchas:
    - "Bun.spawn stdin: 'pipe' option does NOT return a WritableStream — child.stdin has no getWriter(). Use stdin: Bun.file(tempPath) to pipe from a file instead."
    - "Bun.file() expects a file path string, NOT a Blob. Write input to a temp file first, then pass Bun.file(tempPath) as stdin option."
    - "Bun.spawn env: spread Bun.env first, then override specific vars. Empty string overrides are valid (e.g., CRYPLATIVE_SESSION_ID: '' clears the var)."
  test_coverage:
    enforce-agent-access: "17 tests: agent allow/deny, tool classification (Read/Write/Bash/Grep/WebFetch), path traversal, glob matching"
    session-logger: "13 tests: SessionStart metadata, UserPromptSubmit print/interactive mode, Stop response, delegated mode skip, edge cases, agent_logs race condition (3 tests: missing response, no duplicate, tool_result ending)"
    yaml-validator: "6 tests: valid/invalid YAML, mixed files, empty dir, nested dirs, nonexistent dir"
    session-logging: "2 tests: basic -p session creation, --agent session with correct metadata"
    delegation: "2 tests: delegate script creates delegation+response entries, agent_logs for child (with assistant response verification)"
    access-control: "3 tests: write deny outside domain, read allow inside domain, read-only session access"
